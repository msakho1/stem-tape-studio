name: firmware

# Builds the untouched SP-1 Tape Looper firmware exactly as firmware/README.md
# specifies: Zephyr v4.3.1 + Zephyr SDK 0.17.4, the UAC2 Windows FS-feedback
# patch applied to the Zephyr tree, then a single west build.
#
# Workspace layout (all paths are relative to $GITHUB_WORKSPACE):
#   project/           <- west workspace topdir (this repository)
#   project/zephyr/    <- Zephyr v4.3.1 checkout created by action-zephyr-setup
#   project/firmware/  <- Zephyr application + in-repo board + patches
#   project/build/     <- build output
#
# No job-level Docker container: the zephyrproject-rtos/ci image unpacks every
# toolchain (Xtensa included) and exhausts the runner disk. action-zephyr-setup
# installs only the arm-zephyr-eabi toolchain.

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Zephyr v4.3.1 + SDK 0.17.4 (arm-zephyr-eabi only)
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          base-path: project
          app-path: firmware
          toolchains: arm-zephyr-eabi
          sdk-version: 0.17.4

      - name: Path preflight
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          test -d zephyr
          test -f zephyr/VERSION
          test -d firmware
          test -f firmware/CMakeLists.txt
          test -d firmware/boards/teenageengineering/stem_player
          test -f firmware/patches/uac2-windows-fs-feedback.patch
          west topdir

      - name: Apply documented Zephyr patch
        working-directory: ${{ github.workspace }}/project/zephyr
        run: |
          set -eux
          git apply --verbose ../firmware/patches/uac2-windows-fs-feedback.patch

      - name: Build (west build -p always -b stem_player firmware)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          west build -p always -b stem_player firmware \
            -- -DBOARD_ROOT="$GITHUB_WORKSPACE/project/firmware"

      - name: Report artifact hash
        working-directory: ${{ github.workspace }}/project/build/zephyr
        run: |
          set -eux
          cp zephyr.bin sp1_looper.bin
          ls -l sp1_looper.bin
          sha256sum sp1_looper.bin | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload sp1_looper.bin
        uses: actions/upload-artifact@v4
        with:
          name: sp1_looper-bin
          path: project/build/zephyr/sp1_looper.bin
          if-no-files-found: error
