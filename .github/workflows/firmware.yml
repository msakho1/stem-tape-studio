      - name: Stem Tape AUDIO-REACTIVE Track LEDs -- the lights follow the stems, not the clock
        # THE BRIEF, and the line it drew:
        #
        #   stem audio -> activity/envelope detection -> LED brightness
        #   NOT
        #   tempo clock -> blink LED
        #
        #   "There should NOT be an artificial flash on every quarter note,
        #    eighth note, beat, or bar unless the audio itself causes that
        #    response."
        #
        # The step above proves the envelope and the curve in isolation, on
        # fabricated peak values. THIS one proves the behaviour, by
        # synthesising real stem material -- residual hiss, a sustained note,
        # isolated drum hits, a vocal with phrases and rests, and three tones
        # an even 9 dB apart -- and pushing it through the same per-stem peak
        # extraction, the same envelope follower and the same
        # st_led_mvp_decide() the firmware runs.
        #
        # A LIVE TEMPO RUNS THROUGH EVERY CASE. That is deliberate: the
        # failure being excluded is a row that tracks the beat, so the beat
        # has to be available for it to track. Case 6 measures the
        # correlation directly -- for perfectly steady audio the light must
        # read the SAME on the beat and off it -- and also checks that S4
        # still carries the tempo, because removing the beat from the Track
        # row must not remove it from the device.
        #
        # The other structural claim is independence: four meters, one per
        # stem, never the mix. An implementation that metered the summed
        # output would give all four lights one value, and case 5 is what
        # catches it.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_stem_meter.c \
            firmware/stemtape_player/src/st_beat_phase.c \
            firmware/stemtape_player/src/st_led_mvp.c \
            firmware/stemtape_player/tests/test_led_audio_reactive.c \
            -lm -o audit/test_led_audio_reactive
          ./audit/test_led_audio_reactive | tee audit/led-audio-reactive.txt

          # THE GATE MUST KEEP MEASURING, not just exit 0. If any of these
          # lines stops being printed, the harness has stopped asking one of
          # the brief's questions and a silent pass would be worth nothing.
          grep -q 'on the beat' audit/led-audio-reactive.txt
          grep -q 'equal steps in dB are equal steps in brightness' \
            audit/led-audio-reactive.txt
          # The expressiveness half: the per-stem spread table, and the
          # measured pop of an attack above the glow it lands on.
          grep -q 'each stem alone must still visibly animate' \
            audit/led-audio-reactive.txt
          grep -q 'pops above the ringing one' audit/led-audio-reactive.txt

          # AND THE PRODUCTION PATH MUST USE IT. The modules are pure and
          # would pass just as happily unwired.
          M=firmware/stemtape_player/src/main.c
          L=firmware/stemtape_player/src/st_led_mvp.c
          fail=0
          grep -q '^#include "st_stem_meter.h"' "$M" || {
            echo "  main.c does not include st_stem_meter.h"; fail=1; }
          grep -q 'st_stem_meter_update(&s_stem_meters\[i\], peak, dt_led)' "$M" || {
            echo "  the envelopes are not advanced from live per-stem peaks"
            fail=1; }
          grep -q 'st_stem_meter_brightness(&s_stem_meters\[i\])' "$M" || {
            echo "  the meter's brightness never reaches the LED inputs"
            fail=1; }
          # READ AND CLEAR. A plain read would leave the audio thread's peak
          # hold pinned at the loudest sample of the whole song, and every
          # light would stick on.
          grep -q 'atomic_set(&g_stem_peak_pub\[i\], 0)' "$M" || {
            echo "  the peak hold is read without being cleared"; fail=1; }
          # THE TRACK ROW IS THE ACTIVITY, not something scaled by it.
          grep -q 'out->level\[i\] = in->stem_activity\[i\];' "$L" || {
            echo "  the Track row is not driven directly by stem activity"
            fail=1; }
          # BOTH ENVELOPES MUST EXIST. The body's LAGGING attack is the whole
          # mechanism by which an accent can open: set it equal to the fast
          # attack and the two envelopes track each other, the gap is always
          # zero, and the display collapses back to the flat single-envelope
          # row this replaced. Cheap to break by accident while tuning, so it
          # is asserted rather than trusted.
          H=firmware/stemtape_player/src/st_stem_meter.h
          python3 - <<'EOF' || fail=1
          import re, sys
          t = open("firmware/stemtape_player/src/st_stem_meter.h").read()
          def val(name):
              m = re.search(r"#define %s\s+(\d+)u" % name, t)
              return int(m.group(1)) if m else None
          ba = val("ST_STEM_METER_BODY_ATTACK_MS")
          fa = val("ST_STEM_METER_ATTACK_MS")
          share = val("ST_STEM_METER_BODY_SHARE_Q8")
          if ba is None or fa is None or share is None:
              print("  the meter's tuning constants are not where expected")
              sys.exit(1)
          if ba <= fa:
              print("  BODY_ATTACK_MS (%d) must LAG ATTACK_MS (%d): with no "
                    "lag there is no accent and the row goes flat" % (ba, fa))
              sys.exit(1)
          if share >= 256:
              print("  BODY_SHARE_Q8 is %d/256: the body would use the whole "
                    "range and leave no headroom for accents" % share)
              sys.exit(1)
          EOF
          # AND IT IS SET BEFORE THE BEAT GATE. If the assignment moved below
          # the in_pulse early-return, the row would be dark between beats --
          # which is exactly the display this replaced.
          python3 - <<'EOF' || fail=1
          import re, sys
          t = open("firmware/stemtape_player/src/st_led_mvp.c").read()
          i = t.find("out->level[i] = in->stem_activity[i];")
          j = t.find("if (!in->beat.valid || !in->beat.in_pulse) {")
          if i < 0 or j < 0 or i > j:
              print("  the Track row is assigned AFTER the beat gate: it "
                    "would be dark between pulses")
              sys.exit(1)
          EOF
          [ "$fail" = 0 ] || exit 1
          echo "audio-reactive wiring: four meters, four stems, no clock in the path"
          {
            echo '### Stem Tape audio-reactive Track LEDs'
            echo '```text'
            cat audit/led-audio-reactive.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

