      - name: Stem Tape v1.1 full continuous playback gate (Slice 3C)
        # Phase 2, Slice 3C -- the FULL continuous playback gate. Drives
        # the REAL production algorithm (st_stem_stream.h + st_stem_
        # bufmbox.h + st_sector_v11.h + st_stem_mix.h, in the exact call
        # order main.c's own streamer_thread()/audio_thread() use) across
        # TWO REAL pthreads over the entire real, SHA-256-verified
        # handoff/v1.1/binaries/song-sectors-four-stem.bin fixture (43
        # sectors, 14592 frames): simulated boot A/B generation selection
        # against the real frozen index fixtures; every sector boundary
        # crossed exactly once, with per-sector frame counts checked
        # individually (not just in aggregate); a deterministic output
        # hash cross-checked against an independent reference formula;
        # loop behavior (two full passes reproduce an identical hash);
        # corrupt-sector recovery (a deliberately corrupted real sector,
        # one real field flipped, causes real underrun/silence then
        # recovers on retry, with zero effect on the final hash); stalled-
        # producer underrun recovery (same guarantee under an artificially
        # slow producer). See tests/test_stem_playback_gate.c's own doc
        # comment for exactly what this proves and does not.
        #
        # TRUTHFUL CI WORDING (explicit, per this slice's own directive):
        # this step, together with the wiring-check step above and the
        # runtime symbol-presence gate, proves CONTINUOUS FIXTURE-BACKED
        # PLAYBACK -- a real algorithm, run concurrently exactly as
        # designed, over real audio content, with real call sites proven
        # present in main.c's own source. It does NOT constitute AUDIBLE
        # PHYSICAL VERIFICATION on a real SP-1: no physical upload, no
        # eMMC hardware, no I2S/codec hardware, and no human listening
        # test have been performed. Every CI step in this job that
        # touches stored-song playback carries this same distinction;
        # this comment is the canonical statement of it.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -pthread -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_checksum32.c \
            firmware/stemtape_player/src/st_crc32.c \
            firmware/stemtape_player/src/st_sector_v11.c \
            firmware/stemtape_player/src/st_stem_mix.c \
            firmware/stemtape_player/src/st_stem_stream.c \
            firmware/stemtape_player/src/st_stem_bufmbox.c \
            firmware/stemtape_player/src/st_stix.c \
            firmware/stemtape_player/tests/test_stem_playback_gate.c \
            -o audit/test_stem_playback_gate
          ./audit/test_stem_playback_gate | tee audit/stem-playback-gate.txt
          {
            echo '### Stem Tape v1.1 full continuous playback gate (Slice 3C)'
            echo '```text'
            cat audit/stem-playback-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape v1.1 full playback gate ThreadSanitizer run (supplemental evidence)
        # Supplemental evidence ONLY, not the sole proof -- same posture
        # and same caveats as the SPSC mailbox's own TSan step above (see
        # that step's own comment): validates this slice's real two-
        # thread algorithm, including the fault-injection paths (corrupt
        # sector, stalled producer), under real pthreads with TSan's own
        # happens-before tracking. Does not gate the build.
        working-directory: ${{ github.workspace }}/project
        continue-on-error: true
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -pthread -fsanitize=thread -g -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_checksum32.c \
            firmware/stemtape_player/src/st_crc32.c \
            firmware/stemtape_player/src/st_sector_v11.c \
            firmware/stemtape_player/src/st_stem_mix.c \
            firmware/stemtape_player/src/st_stem_stream.c \
            firmware/stemtape_player/src/st_stem_bufmbox.c \
            firmware/stemtape_player/src/st_stix.c \
            firmware/stemtape_player/tests/test_stem_playback_gate.c \
            -o audit/test_stem_playback_gate_tsan
          ./audit/test_stem_playback_gate_tsan | tee audit/stem-playback-gate-tsan.txt
          {
            echo '### Stem Tape v1.1 full playback gate ThreadSanitizer run (supplemental evidence)'
            echo '```text'
            cat audit/stem-playback-gate-tsan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classic native-storage playback source absence gate (fail-closed)
        # STEM TAPE architecture correction (pre-Slice-3A): a valid, playing
        # stored Stem Tape song REPLACES the inherited classic mono-loop
        # audio source in looper_audio_block()'s PASS C -- it is never
        # summed with it. Proves, source-level and fail-closed: (1) every
        # assignment to a present[] array element in main.c writes the
        # literal 0, so the classic per-track engine's own TS_PLAY gate can
        # never be set live from this file; (2) no arithmetic combination of
        # the classic sample and either stem output sample exists anywhere
        # in main.c; (3) PASS C's stem-active branch writes both stereo
        # output slots directly from the stem mix and `continue`s, never
        # falling through to the classic computation in the same iteration.
        # See .github/scripts/stemtape_player_classic_source_absence_gate.py's
        # own doc comment.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/stemtape_player_classic_source_absence_gate.py \
            firmware/stemtape_player/src/main.c \
            audit/classic-source-absence-gate.md | tee audit/classic-source-absence-gate.txt
          {
            echo '### Classic native-storage playback source absence gate'
            echo '```text'
            cat audit/classic-source-absence-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Image assertions (origin, bounds, storage, UICR, entry, vectors, size, BIN identity)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          CACHE=build-stemtape-player/CMakeCache.txt
          cmv() { sed -n "s|^$1:[^=]*=||p" "$CACHE" | tail -n1; }
          READELF="$(cmv CMAKE_READELF)"; OBJCOPY="$(cmv CMAKE_OBJCOPY)"
          OBJDUMP="$(cmv CMAKE_OBJDUMP)"; BINDIR="$(dirname "$OBJDUMP")"
          PREFIX="$(basename "$OBJDUMP")"; PREFIX="${PREFIX%objdump}"
          [ -n "$READELF" ] || READELF="$BINDIR/${PREFIX}readelf"
          [ -n "$OBJCOPY" ] || OBJCOPY="$BINDIR/${PREFIX}objcopy"
          python3 .github/scripts/m0_image_assertions.py \
            build-stemtape-player/zephyr/zephyr.elf \
            build-stemtape-player/zephyr/stemtape_player.bin \
            --readelf "$READELF" --objcopy "$OBJCOPY" | tee audit/image-assertions.txt
          {
            echo '### Stem Tape Player image assertions'
            echo '```text'
            grep -E '^\[(PASS|FAIL)\]|^ALL IMAGE' audit/image-assertions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: STEM TAPE runtime symbol-presence gate (fail-closed)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          # Current vertical slice (Gate 1 USB audio playback + USB-MIDI
          # receive, Stem Tape v1.1 firmware/companion contract migration):
          # proves both that the preserved playback/storage-read/control
          # runtime AND the allowed new capability (USB audio PLAYBACK,
          # incoming USB MIDI, and the real v1.1 Q -> STCP capability
          # handler + A/B storage engine named below) are actually linked
          # into this build's final ELF, AND that RECORDING/OVERDUB
          # capability -- a live capture-to-storage ring, USB-audio-to-
          # storage, or any persistent write outside a validated, region-
          # bounded path -- is genuinely ABSENT from it, not merely "unused
          # at runtime" but not present in the object file at all. Also
          # proves the RETIRED v1.0 Gate 2 transactional-commit contract
          # (V/B/S/K/C/A/D/I) is genuinely absent, not just unreachable:
          # CMakeLists.txt no longer even compiles those modules into this
          # target, so their own definitions can never appear here again.
          # Fails closed (missing nm.txt, any missing required symbol, or
          # any forbidden symbol present = CI failure).
          test -s audit/nm.txt
          missing=0
          # THE VERDICT GOES TO A FILE, not only to stdout. This step's own
          # log tail is entirely consumed by the runner's post-job cleanup,
          # and artifact/raw-log downloads are blocked by egress policy in
          # the environment this is debugged from -- so a "MISSING x" line
          # printed here is, in practice, unreadable. Every failure gets
          # recorded here instead and re-printed by the "Failure
          # diagnostics" step at the very end of the job, where it lands
          # inside the readable tail. Guessing which symbol -Os inlined has
          # already cost real round trips; this ends that.
          : > audit/symbol-gate-verdict.txt
          # nm marks a function's own text symbol lowercase 't' when it has
          # internal (static) linkage and uppercase 'T' when it's external --
          # nearly everything in main.c is `static`, so both cases count as
          # "really linked in" here. trk_blk() and xfer_service() are
          # deliberately NOT checked: both have exactly one, always-taken
          # call site each (trk_blk() a one-line `static inline`;
          # xfer_service() called unconditionally from streamer_thread()'s
          # loop under `#if SP1_XFER_ENABLE`, `#define`d to 1), so -Os
          # legitimately inlines them with no standalone symbol left in nm --
          # confirmed by a real CI run, not anticipated. Reachability is
          # proven instead by their retained callers (streamer_thread, its
          # loop) plus the single unconditional call site in the source.
          check() {
            if ! grep -qE " [tT] ${1}\$" audit/nm.txt; then
              echo "MISSING required linked symbol: $1" >&2
              # Emit a GitHub error ANNOTATION as well as a log line. The log
              # line is correct but unreachable in practice: this job's tail
              # is entirely consumed by the runner's own cleanup output, and
              # artifact/log downloads are blocked by egress policy here. An
              # annotation is carried by the checks API instead of the log,
              # so the failure is legible without needing either.
              echo "::error title=Stem Tape symbol gate::MISSING required linked symbol ${1}"
              echo "- MISSING required linked symbol \`${1}\`" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              # Say WHY, right here. A bare "MISSING" forces whoever reads
              # this to guess whether the function was inlined, renamed by
              # an IPA clone, garbage-collected as uncalled, or emitted with
              # a non-text symbol type -- and that guessing has already cost
              # several round trips. Print every symbol whose name begins
              # with the required one, so the answer is in the log.
              grep -E " [a-zA-Z] ${1}" audit/nm.txt \
                || echo "  -> no symbol beginning '${1}' exists in the ELF at all (uncalled and garbage-collected, or never compiled in)"
              {
                echo "MISSING required linked symbol: ${1}"
                grep -E " [a-zA-Z] ${1}" audit/nm.txt \
                  || echo "  -> no symbol beginning '${1}' exists in the ELF at all"
              } >> audit/symbol-gate-verdict.txt
              missing=1
            else
              echo "present: $1"
            fi
          }
          # Same as check(), but for required DATA/BSS objects (a ring
          # buffer, a memory slab, a `const struct device *const` pointer)
          # rather than functions -- nm marks these with a type letter
          # other than t/T (e.g. b/B/d/D/r/R), so check()'s text-only
          # pattern would never match them even when genuinely linked.
          check_any() {
            if ! grep -qE " [a-zA-Z] ${1}\$" audit/nm.txt; then
              echo "MISSING required linked symbol: $1" >&2
              echo "MISSING required linked object: ${1}" >> audit/symbol-gate-verdict.txt
              missing=1
            else
              echo "present: $1"
            fi
          }
          # storage read path (write is checked ABSENT below)
          check emmc_read_blocks
          check emmc_cache_flush
          # cold-boot discovery + the shared-transport playback engine
          check streamer_thread
          check audio_thread
          # looper_audio_block() itself is deliberately NOT checked -- and
          # this, like trk_blk()/xfer_service()/midi_dev above, is confirmed
          # by a real CI run, not anticipated. It is `static` with exactly
          # ONE unconditional call site (inside audio_thread()'s block loop,
          # between the DWT timestamps that feed aus=), which makes it
          # eligible for -finline-functions-called-once. It survived as a
          # standalone symbol while it was ~1070 lines; once the Stem Tape
          # fast-path work removed PASS 2, PASS B and their buffers it fell
          # under the compiler's function-growth limit and is now inlined
          # into audio_thread() with no symbol left. Requiring it would mean
          # forcing a noinline attribute onto a function whose only purpose
          # is to be called once per block -- i.e. paying a call frame per
          # audio block to satisfy a grep. This gate's own rule already
          # covers that case: requiring a symbol the runtime does not need
          # would be requiring dead weight in the ELF.
          #
          # Nothing is lost from the proof, because what was being proven is
          # proven better below and elsewhere:
          #   - audio_thread() itself IS checked present, immediately above,
          #     and it is the function the inlined body now lives in;
          #   - the source-level wiring check step REQUIRES audio_thread()
          #     to call looper_audio_block() and i2s_write(), so the call
          #     site is proven in main.c's own source, which is the thing a
          #     symbol's mere presence never proved anyway;
          #   - and the two checks below name the actual Stem Tape render
          #     path rather than the inherited wrapper around it.
          #
          # THE STEM TAPE AUDIO FAST PATH, at link level. stem_audio_block()
          # is the whole Stem Tape block renderer (mailbox acquire, channel
          # strip, mix prepare, run-form advance, peak publication) and
          # stem_render_run() is its per-frame decode/mix/meter/master-volume
          # inner loop. Both are reached ONLY from the dispatch that runs
          # before any classic work and returns without touching it, so
          # requiring them here is link-level evidence of the bypassing path
          # itself -- strictly more specific than requiring the shared
          # wrapper that both engines used to run through. The complementary
          # source-level proof (that this dispatch precedes every classic
          # statement, rather than merely running near it) is the wiring
          # check's own BYPASS PROOF section plus the classic-source-absence
          # gate.
          check stem_audio_block
          check stem_render_run
          # TRANSPORT INERTIA. The envelope is a real translation unit and
          # must be linked, not merely present in the tree: a spin-down that
          # is not in the image is a mute. (st_resample.h is header-only and
          # inlines into the run loop, so it has no symbol of its own -- the
          # inertia step above proves its use by source grep instead.)
          check st_inertia_play
          check st_inertia_stop
          check st_inertia_advance
          # ROCKER SEMITONES. The ratio lookup must be in the image: a build
          # that linked the gesture but not the grid would move a number
          # nothing plays.
          check st_pitch_ratio_q16
          check st_pitch_click
          check st_pitch_tick
          # FX+PLAY SLOW PLAYBACK. The glide is the only non-inline part of
          # the slow path (st_pitch_effective_q16 is a static inline and has
          # no symbol -- the rocker step above proves its use by source grep),
          # and a build that linked the toggle but not the glide would step a
          # whole octave in one block.
          check st_pitch_slow_glide
          # physical control scanner (button/fader ladder read) + LED output
          check ladder_read
          check led_service
          check led_pwm_isr
          # MIDI clock output thread
          check midi_thread
          check main
          # STEM TAPE: UAC2 (USB audio class) playback is REMOVED (see
          # main.c's own top-of-file comment) -- required-ABSENT checks for
          # every UAC2 symbol are in the required-absent section below,
          # alongside the USB descriptor assertion step's own C-level and
          # devicetree-level proof.
          #
          # midi_dev itself is NOT checked here (confirmed missing from
          # nm.txt by a real CI run, not anticipated): it is a
          # `static const struct device *const` initialized to
          # DEVICE_DT_GET(...), a link-time-constant address that is never
          # address-taken elsewhere in this file -- -Os legitimately
          # constant-propagates that address into every call site and
          # leaves no standalone data symbol, the exact same class of
          # elimination this gate's own comment above already documents
          # for trk_blk()/xfer_service(). Reachability is proven instead by
          # the retained functions that take/pass the device pointer:
          # device_is_ready()/usbd_midi_set_ops() calls inside
          # usb_audio_start(), and the *_cb functions below (each declared
          # `(const struct device *dev, ...)` and registered by address in
          # sp1_midi_ops, which the USB descriptor assertion step
          # separately proves is wired to a real, enabled devicetree
          # instance).
          # GATE 1: incoming USB-MIDI receive path (KO II cue control)
          check midi_rx_packet_cb
          check midi_ready_cb
          check midi_service
          check st_midi_decode_ump32
          check st_midi_queue_push
          # Stem Tape v1.1: the real Q -> STCP capability handler + session
          # refresh + guarded write (main.c's own four new functions), and
          # the v1.1 A/B storage engine's top-level entry points main.c
          # directly calls -- boot-time region-layout computation, STIX v2
          # active-index selection (used identically by 'Q', the boot-time
          # A/B-selection log, and session-open), the STCP capability-reply
          # builder, the write-safety session's two open paths, the guarded-
          # write path's own real gate call, the pre-commit song-checksum
          # verification, and the STIX record deserializer the guarded-write
          # path uses to inspect a candidate commit block. Deeper internals
          # these in turn call (st_stix_validate(), the STSC sector codec,
          # the FNV-1a checksum, CRC-32) are still NOT checked -- this gate
          # can't yet confirm which of those deeper pure functions -Os keeps
          # as standalone symbols vs. inlines without a real CI run to show
          # it, the same "confirmed by a real CI run, not anticipated"
          # discipline this gate's own comments already apply to
          # trk_blk()/xfer_service()/uac2_dev/midi_dev above.
          check xfer_v11_refresh_session
          check xfer_v11_send_caps
          check xfer_v11_write
          check xfer_v11_block_read
          # Upload-reliability phase, Slice C2: the real bulk verified-
          # sector upload handler main.c's xfer_service() calls directly
          # for 'U' (docs/stem-tape-bulk-upload-v1.md). Deeper st_bulk_*
          # helpers it in turn calls are NOT checked here, matching this
          # gate's own established policy just above for st_stix_
          # validate()/the STSC codec/FNV-1a/CRC-32 -- confirmed by a real
          # CI run, not anticipated.
          check xfer_bulk_write_sector
          check st_stix_read_library
          check st11_storage_layout_compute
          check st11_stcp_build
          check st_ab_session_open_replace
          check st_ab_session_open_init
          check st_ab_session_check_write
          check st_ab_session_verify_song_before_commit
          check st_stix_deserialize
          # Phase 2 slice 2/3B/3B.1: the stored four-stem playback data
          # path -- looper_audio_block() (real-time, RAM-only, the
          # mailbox CONSUMER) calls the st_stream_*/st_stem_mix_*
          # ones and the two st_stem_mbox_* consumer-side entries;
          # streamer_thread() (the mailbox PRODUCER) calls the rest,
          # both at boot and on every per-pass prefetch, to validate
          # every sector it reads from flash (not just the first) and
          # publish it through the real atomic mailbox (st_stem_
          # bufmbox.h), never a shared struct touched by both threads.
          # Proven to be REAL call sites (not just linked symbols) by
          # the separate "stored four-stem playback wiring check" CI
          # step below, which parses main.c's own source.
          check st11_sector_decode_frame
          check st11_sector_read_header
          # st_stem_mix_prepare()/st_stem_mix_frame_prepared(), not
          # st_stem_mix_frame(): the audio path calls the two halves
          # separately so the mute/solo/gain-ceiling work runs once per
          # block instead of 48000 times a second. st_stem_mix_frame()
          # itself is the two of them back to back, kept for callers that
          # mix a single frame (the host tests), and -ffunction-sections/
          # --gc-sections is right to drop it from an image that never
          # calls it -- requiring it would be requiring dead weight.
          check st_stem_mix_prepare
          check st_stem_mix_frame_prepared
          # THE FX RACK. Required here because until this was added, nothing
          # in CI obliged st_fx_process() to survive linking at all: the two
          # FX host tests exercise the module standalone and never touch
          # main.c, so a rack that had lost its call sites would have been
          # garbage-collected out of the image by -ffunction-sections/
          # --gc-sections and every gate would still have been green. The
          # firmware would have shipped with correct FX arithmetic that no
          # audio ever passed through.
          #
          # st_fx_process() is the per-frame entry point (both scopes call
          # it) and st_fx_prepare() is the once-per-block tempo/mask publish.
          # The companion "FX PRODUCTION WIRING" gate proves the rack changes
          # real audio; these prove the code it proves is actually in the
          # image that ships.
          #
          # st_fx_reset() is deliberately NOT required, on the same grounds
          # this file already states for st_stem_mix_frame() and
          # st_stream_advance_frame(): it has no production call site. It is
          # a memset to zero, and g_stem_fx is a file-scope static, so the
          # boot state it would produce is the one the loader already
          # guarantees. Requiring it would be requiring dead weight.
          check st_fx_process
          check st_fx_prepare
          check_any g_stem_fx
          check st_stream_init
          check st_stream_required_sector
          check st_stream_validate_sector
          check st_stream_sector_ready
          # The RUN form is what the audio path calls now; the
          # per-frame st_stream_advance_frame() remains part of the pure
          # module's API and is still exercised by tests/test_stem_stream.c
          # (which proves the two agree over a whole song), but the runtime
          # no longer calls it, so -ffunction-sections/--gc-sections is
          # right to drop it and requiring it here would be requiring dead
          # weight in the ELF.
          check st_stream_advance_frames
          check st_stem_mbox_init
          check st_stem_mbox_try_acquire
          check st_stem_mbox_set_requested_sector
          # The ring (st_stem_bufmbox.h) replaced the two-buffer mailbox's
          # producer_target_slot() with producer_next_fill(), which picks
          # BOTH the sector and its slot. requested_sector() is no longer
          # in the required set: next_fill() reads that field internally,
          # so main.c has no reason to call the accessor and -ffunction-
          # sections/--gc-sections correctly drops it from the image. It
          # is still part of the producer-side API and still exercised by
          # tests/test_stem_bufmbox.c; requiring a symbol the runtime does
          # not use would be requiring dead weight in the ELF.
          check st_stem_mbox_producer_next_fill
          check st_stem_mbox_release
          check st_stem_mbox_publish_ready
          # THE SEMANTIC LED OWNER, at link level. st_led_mvp_decide() is the
          # ONE function that decides what the eight LEDs show, and
          # st_led_batt_classify() is the trustworthy-battery rule that keeps
          # an unavailable or faulted reading from ever being rendered as a
          # charge level. Both are cross-TU (src/st_led_mvp.c), so unlike a
          # single-call-site static they cannot be inlined away.
          #
          # led_service()/led_apply_frame() are deliberately NOT checked: both
          # are `static` in main.c with one call site each, exactly the shape
          # that made looper_audio_block() vanish from the ELF once it shrank.
          # Their wiring is proven at the source level instead, by the stored
          # four-stem playback wiring check's own "Exactly one semantic owner
          # of the eight LEDs" section, which is strictly stronger: it proves
          # led_service() writes no LED mask directly and that
          # show_song_leds()/the peak meter/the standby chase are absent from
          # the source outright.
          check st_led_mvp_decide
          check st_led_batt_classify

          # REQUIRED-ABSENT: any of these appearing in the final ELF (any nm
          # symbol type -- function OR data/bss) means recording, overdub,
          # a live capture-to-storage path, a raw persistent-write
          # capability outside a validated path, or the RETIRED v1.0 write
          # contract leaked back into the link, which this target must
          # never allow. USB audio PLAYBACK and incoming USB MIDI (GATE 1)
          # and the v1.1 Q/A-B-storage capability checked above are the
          # allowed, required new capability this vertical slice adds --
          # none of that is recording, and recording itself stays
          # forbidden.
          absent() {
            if grep -qE "[[:space:]]${1}\$" audit/nm.txt; then
              echo "FORBIDDEN symbol present in final ELF: $1" >&2
              {
                echo "FORBIDDEN symbol present in final ELF: ${1}"
                grep -E "[[:space:]]${1}\$" audit/nm.txt || true
              } >> audit/symbol-gate-verdict.txt
              missing=1
            else
              echo "confirmed absent: $1"
            fi
          }
          # eMMC/index write primitives -- meta_write_blocks() is removed
          # from src/main.c entirely (no definition left to link); this
          # gate does not forbid emmc_write_blocks() itself (the v1.1
          # write-safety session's guarded 'W' legitimately needs it) --
          # see the STRICT persistence safety gate step below, which
          # proves every eMMC write call site instead of forbidding the
          # symbol.
          absent meta_write_blocks
          # the live-input record ring (32 KB) and any recording/overdub
          # state -- must never come back, with or without USB audio.
          absent g_rring
          absent g_record_arm
          absent g_overdub
          # STEM TAPE: UAC2 (USB audio class) playback -- runtime callbacks,
          # buffers, the memory slab, the device pointer, the ops table,
          # every diagnostic counter, and the Windows feedback-format
          # negotiation -- is REMOVED (product decision: it was added
          # earlier under the mistaken assumption that KO II cue control
          # depended on it; cue control actually uses incoming USB MIDI
          # only). None of this has a definition left to link at all (see
          # main.c's own top-of-file comment and prj.conf, which no longer
          # enables CONFIG_USBD_AUDIO2_CLASS) -- not merely unreachable.
          # See also the "Effective configuration assertion" and "USB
          # descriptor assertion" steps below for the Kconfig-level and
          # C-descriptor/devicetree-level proof.
          absent usb_audio_ring
          absent uac2_rx_slab
          absent uac2_dev
          absent uac2_terminal_update_cb
          absent uac2_get_recv_buf
          absent uac2_data_recv_cb
          absent uac2_buf_release_cb
          absent uac2_feedback_cb
          absent uac2_sof_cb
          absent sp1_uac2_ops
          absent g_usb_streaming
          absent g_fb_value
          absent g_fill_avg
          absent g_fb_running
          absent feedback_reset
          absent feedback_update
          absent uac2_fs_fb_windows_fmt
          absent g_ring_underruns
          absent g_ring_overflows
          absent g_usb_pkts
          absent g_usb_frames
          absent g_sof_cnt
          absent g_zero_pad
          absent g_rx_nobuf
          absent g_rx_slab_min
          absent g_usb_lowat
          absent g_usb_hiwat
          # Stem Tape v1.0 Gate 2 (RETIRED as of this migration -- see
          # docs/stem-tape-transfer-v1.1.md, docs/stem-tape-transfer-v1.md
          # is the old, superseded doc): the single-index transactional
          # write path (command verbs V/B/S/K/C/A/D/I) must never come
          # back. Not merely "unreachable" -- CMakeLists.txt no longer
          # compiles st_storage_layout.c/st_sector_codec.c/st_transfer.c/
          # st_library_io.c/st_xfer_wire.c into this target at all, so
          # these functions' own DEFINITIONS, not just call sites, must be
          # entirely absent from the ELF. (Those files stay in the tree and
          # keep their own host tests -- tests/test_stemtape_player.c --
          # for regression evidence only.)
          absent xfer_staging_write
          absent xfer_header_write
          absent xfer_songdata_write
          absent xfer_lib_save
          absent xfer_do_commit
          absent st_xfer_begin
          absent st_xfer_stage_sector
          absent st_xfer_verify
          absent st_xfer_commit_precheck
          absent st_xfer_build_slot_meta
          absent st_libio_load
          absent st_libio_save
          absent st_xfer_wire_decode_begin_req
          # Stem Tape upload-reliability phase, Slice T0 (RETIRED as of
          # Slice C4 -- see main.c's own removal note where these used to
          # be defined, and docs/stem-tape-benchmark-t0.md's own status
          # note): the throughput benchmark's own 'Y' command and its
          # entire write path must never come back now that the real bulk
          # verified-sector path (xfer_bulk_write_sector(), 'U') supersedes
          # it. Not merely "unreachable" -- these functions' own
          # DEFINITIONS, not just call sites, must be entirely absent from
          # the ELF, the same standard already applied to the retired v1.0
          # write path just above.
          absent xfer_bench_run
          absent bench_inactive_song_region
          absent bench_fill_pattern
          absent bench_send_result
          absent bench_send_error

          if [ "$missing" -ne 0 ]; then
            echo "one or more required runtime symbols are missing, or one or more forbidden symbols are present, in the final ELF" >&2
            exit 1
          fi
          echo "all required Stem Tape runtime symbols are linked (USB MIDI receive, the v1.1 Q/A-B-storage capability, and the stored four-stem playback data path), and all forbidden recording/overdub, UAC2/USB-audio-playback, retired-v1.0-write-path, AND retired-T0-benchmark symbols are confirmed absent, in zephyr.elf"

      - name: Effective configuration assertion (fail-closed)
        # Checks the REAL effective .config the build actually used (not
        # prj.conf, which only requests values -- some are silently
        # overridden by board/SoC defaults or dependency rules).
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          CFG=build-stemtape-player/zephyr/.config
          test -f "$CFG"
          fail=0
          expect_set() {
            if ! grep -qE "^$1=y\$" "$CFG"; then
              echo "::error::$1 is not =y in the effective config (required)"
              fail=1
            else
              echo "confirmed enabled: $1"
            fi
          }
          # STEM TAPE: UAC2 (USB audio class) playback is REMOVED -- product
          # decision, see main.c's own top-of-file comment. Confirms the
          # REAL effective build never silently re-enabled it (e.g. via a
          # board/SoC default or a dependency rule this file's own request
          # doesn't control).
          expect_unset() {
            if grep -qE "^$1=y\$" "$CFG"; then
              echo "::error::$1 IS =y in the effective config (forbidden -- UAC2 audio playback must stay removed)"
              fail=1
            else
              echo "confirmed NOT enabled: $1"
            fi
          }
          expect_unset CONFIG_USBD_AUDIO2_CLASS
          expect_set   CONFIG_USBD_MIDI2_CLASS
          expect_set   CONFIG_USBD_CDC_ACM_CLASS
          expect_set   CONFIG_I2S
          expect_set   CONFIG_ADC
          expect_set   CONFIG_I2C
          expect_set   CONFIG_WATCHDOG
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "effective configuration matches the Gate 1 requirements (UAC2 audio playback confirmed absent)"

      - name: USB descriptor assertion (fail-closed)
        # A symbol name alone is not proof: this proves the actual
        # descriptor material (not just callback glue) and its enabling
        # devicetree topology are compiled into the final image. See
        # .github/scripts/stemtape_player_usb_descriptor_assertions.py's
        # own docstring for exactly what's checked and why.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/stemtape_player_usb_descriptor_assertions.py \
            audit/nm.txt \
            build-stemtape-player/zephyr/zephyr.elf \
            build-stemtape-player/zephyr/zephyr.dts \
            audit/usb-descriptor-assertion.md | tee audit/usb-descriptor-assertion.txt
          {
            echo '### Stem Tape Player USB descriptor assertion'
            echo '```text'
            cat audit/usb-descriptor-assertion.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persistent-memory and power audit report (descriptive)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/m0_persistence_audit.py \
            audit/nm.txt audit/persistence-audit.md > /dev/null
          echo "report written: audit/persistence-audit.md"

      - name: STRICT persistence safety gate (fail-closed)
        # stemtape-player is NOT stemtape-m0: this target's entire purpose is
        # to durably persist validated 4-stem songs to eMMC, so m0_safety_
        # gate.py's blanket "no eMMC write capability may be linked" property
        # is the wrong gate here -- eMMC writes are the exact capability the
        # Stem Tape v1.1 write path legitimately needs.
        # stemtape_player_safety_gate.py is a DIFFERENT, still strictly
        # fail-closed gate, scoped to this target: every other forbidden
        # category (internal-flash, NVMC, UICR/APPROTECT, any OTHER disk/
        # filesystem/NVS subsystem, MCUboot) stays exactly as forbidden as it
        # is for stemtape-m0, and the one real emmc_write_blocks call site is
        # allowed ONLY when proven -- by real source inspection, evidence
        # printed below -- to be inside xfer_v11_write(), the sole write
        # adapter for the v1.1 A/B storage engine, with its real safety-
        # mechanism pattern (g_v11_layout_ready, st_ab_session_check_write())
        # confirmed present in its own source body. The retired v1.0
        # adapters must have zero call sites -- they have no definition left
        # to link in this derivative at all. m0_safety_gate.py itself is
        # untouched and still strictly applied, unchanged, to the
        # stemtape-m0 job below.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/stemtape_player_safety_gate.py \
            audit/nm.txt audit/objdump-d.txt build-stemtape-player/zephyr/.config \
            audit/safety-gate.md 2>&1 | tee audit/safety-gate.txt
          gate_rc=${PIPESTATUS[0]}
          set -e
          {
            echo '### Stem Tape Player strict persistence safety gate'
            echo '```text'
            cat audit/safety-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_rc"

      - name: Hashes and sources
        # STEM TAPE: made resilient to a FAILED build (this step already ran
        # if: always(), but previously used bare `cp` under `set -e` for the
        # final artifacts, so a failed link -- no zephyr.elf/.bin/.map --
        # made THIS step also fail before it ever reached the source-tree
        # copy, silently discarding the one thing most useful for debugging
        # a failed build: build.log (already captured by the Build step's
        # own `tee`) and, for a link failure specifically, the linker's own
        # PARTIAL map (zephyr_pre0.map, produced even when the final
        # zephyr_pre0.elf link fails -- see e.g. "region `RAM' overflowed").
        # This does NOT change whether the build step itself passes or
        # fails -- that verdict is untouched -- it only stops throwing away
        # the evidence when it doesn't.
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/project
        run: |
          set -uxo pipefail
          B=build-stemtape-player/zephyr
          git diff > audit/git-diff.txt
          {
            echo "build_succeeded=$( [ -f "$B/zephyr.elf" ] && echo 1 || echo 0 )"
          } > audit/build-status.txt
          cat audit/build-status.txt
          ( cd "$B" && sha256sum stemtape_player.bin zephyr.bin zephyr.elf zephyr.hex 2>/dev/null || true ) \
            > audit/sha256.txt
          # Best-effort per file: never let one missing artifact (e.g. a
          # failed final link) discard everything else that DID get produced.
          for f in stemtape_player.bin zephyr.elf zephyr.map zephyr.dts zephyr_pre0.map zephyr_pre0.elf; do
            [ -f "$B/$f" ] && cp "$B/$f" audit/ || echo "audit: $f not present (expected on a failed build)"
          done
          [ -f "$B/.config" ] && cp "$B/.config" audit/config.txt
          [ -f build-stemtape-player/CMakeCache.txt ] && cp build-stemtape-player/CMakeCache.txt audit/
          [ -f build-stemtape-player/compile_commands.json ] && cp build-stemtape-player/compile_commands.json audit/
          mkdir -p audit/src/stemtape_player audit/src/board audit/src/workflow audit/src/docs
          cp -r firmware/stemtape_player/. audit/src/stemtape_player/
          cp -r firmware/boards/teenageengineering/stem_player/. audit/src/board/
          cp firmware/west.yml audit/src/
          cp .github/workflows/firmware.yml audit/src/workflow/
          cp .github/scripts/m0_image_assertions.py \
             .github/scripts/m0_assertions_selftest.py \
             .github/scripts/m0_persistence_audit.py \
             .github/scripts/stemtape_player_safety_gate.py \
             .github/scripts/stemtape_player_usb_descriptor_assertions.py audit/src/workflow/
          cp docs/stem-tape-transfer-v1.md docs/stem-tape-transfer-v1-fixtures.json audit/src/docs/ 2>/dev/null || true
          if [ -f audit/stemtape_player.bin ]; then
            stat -c '%n %s bytes' audit/stemtape_player.bin | tee -a "$GITHUB_STEP_SUMMARY"
            cat audit/sha256.txt | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### stemtape-player: BUILD FAILED -- no final artifact"
              echo '```text'
              echo "zephyr.elf was not produced. See audit/build.log and, if present,"
              echo "audit/zephyr_pre0.map for the linker's partial output."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload stemtape-player-audit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: stemtape-player-audit
          path: project/audit/**
          if-no-files-found: error

      # Runs ONLY when something above failed, and is the LAST step in the
      # job -- placed AFTER the artifact upload on purpose, because the
      # upload emits ~45 lines and pushed the first version of this step
      # out of the readable tail of the log. The symbol gate's own failure
      # message is emitted mid-job, thousands of lines from the end, where
      # log-tailing tools cannot reach it -- which has already cost more
      # than one round trip to diagnose a single missing name. This puts the
      # relevant facts where they can always be read.
      - name: Failure diagnostics (symbol-gate verdict + stem/stream symbols actually linked)
        if: ${{ failure() }}
        working-directory: project
        run: |
          # THE SYMBOL-GATE VERDICT COMES FIRST, and it is the whole point
          # of this step. The gate itself runs ~60 checks and prints its
          # failures in the middle of the job, where the log tail (the only
          # part reachable when artifact and raw-log downloads are blocked
          # by egress policy) never reaches. It now records every failure to
          # audit/symbol-gate-verdict.txt, and this step -- the last one in
          # the job -- prints it where it can actually be read. A previous
          # round of this exact failure was diagnosed by guessing which
          # function -Os had inlined, using a hand-written prefix grep that
          # happened not to cover the symbol that was actually missing.
          echo "=== symbol-gate verdict (every failed check, in order) ==="
          if [ -f audit/symbol-gate-verdict.txt ]; then
            if [ -s audit/symbol-gate-verdict.txt ]; then
              cat audit/symbol-gate-verdict.txt
            else
              echo "(the symbol gate ran and passed every check -- the failure is in some other step)"
            fi
          else
            echo "(the symbol gate did not run -- an earlier step failed first)"
          fi
          echo "=== end verdict ==="
          echo "=== symbols matching st_stream_/st_stem_/stem_render_/st11_/stem_ in the ELF ==="
          grep -E " [a-zA-Z] (st_stream_|st_stem_|stem_render_|st11_|stem_)" audit/nm.txt || echo "(none found)"
          echo "=== end ==="

      # RELEASE IDENTITY, LAST, ALWAYS. Everything printed here already
      # exists somewhere in this job -- the BIN's size and SHA-256 from
      # "Hashes and sources", the RAM figures from the RAM budget assertion,
      # the FLASH figures from the link itself. The problem is WHERE: all of
      # them are emitted mid-job, and the only part of this log reachable
      # from the environment this is released from is the tail, which the
      # runner's own post-job cleanup fills. On a failing run the extra
      # diagnostics step happened to push the hashes into view; on a PASSING
      # run -- the only kind whose artifact anyone would actually flash --
      # they fall out of reach entirely.
      #
      # These are exactly the numbers a candidate binary has to be handed
      # over with: which image, how big, what hash, and how much RAM is
      # genuinely left after the read-ahead ring. Being unable to read them
      # off a green build is not acceptable, so they get restated here, at
      # the very end, on success and on failure alike.
      - name: RAM inventory -- every writable symbol, reconciled to the linker
        # WHY THIS EXISTS. Every RAM figure in this repository used to be the
        # linker's single "RAM: N bytes" line plus hand-reading of the source.
        # That is enough to notice a regression and not enough to decide
        # anything: it cannot say which subsystem owns a pool, whether two
        # pools are alive at once, or whether a size was ever measured. This
        # produces the per-symbol picture from the real ELF, reconciled
        # against the linker's own total so nothing hides in "framework
        # overhead", and enforces committed per-category budgets as ratchets.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/stemtape_player_ram_inventory.py \
            audit/nm.txt audit/readelf.txt audit/build.log \
            .github/scripts/stemtape_player_ram_ownership.json \
            .github/scripts/stemtape_player_ram_budgets.json \
            audit/ram-inventory.md audit/ram-inventory.json
          {
            echo '### Stem Tape Player RAM inventory'
            cat audit/ram-inventory.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release identity (BIN hash/size, FLASH and RAM use) -- printed last so it is readable
        if: ${{ always() }}
        working-directory: project
        run: |
          echo "=== release identity ==="
          # The authoritative memory-region report west itself computed from
          # the real linked ELF -- not a re-derived estimate.
          USED=""
          if [ -f audit/build.log ]; then
            grep -E '^ *(FLASH|RAM):' audit/build.log | tail -n 4 || echo "(no memory-region lines found)"
            RAM_LINE="$(grep -E '^ *RAM:' audit/build.log | tail -n1 || true)"
            if [ -n "$RAM_LINE" ]; then
              USED="$(echo "$RAM_LINE" | grep -oE '[0-9]+' | head -n1)"
              echo "RAM used: ${USED} bytes; free: $((262144 - USED)) bytes of the 262144-byte region"
              echo "          (the gate requires at least 32768 bytes free, and that floor is unchanged)"
            fi
          else
            echo "(audit/build.log absent -- nothing to report)"
          fi
          # ONE DENSE LINE, LAST OF ALL. Everything above is already at the
          # mercy of how much output the runner's post-job cleanup pushes out
          # of reach -- on the first run of this step the cache-save output
          # grew and shoved the BIN's hash out of the readable window, which
          # is the single number a candidate binary most has to be handed
          # over with. So the essentials are restated on ONE line, emitted
          # dead last, small enough to survive whatever the tail budget turns
          # out to be.
          if [ -f audit/stemtape_player.bin ]; then
            BIN_SIZE="$(stat -c '%s' audit/stemtape_player.bin)"
            BIN_SHA="$(sha256sum audit/stemtape_player.bin | cut -d' ' -f1)"
            echo "RELEASE commit=${{ github.event.pull_request.head.sha || github.sha }} bin=${BIN_SIZE}B sha256=${BIN_SHA} ram_used=${USED:-?} ram_free=$((262144 - ${USED:-0}))"
          else
            echo "RELEASE commit=${{ github.event.pull_request.head.sha || github.sha }} bin=NOT-PRODUCED (the build did not reach a final link)"
          fi
          # THE CALIBRATION IMAGE'S IDENTITY, RESTATED HERE FOR THE SAME
          # REASON. It is printed once by the AIN1 CALIBRATION IMAGE step near
          # the TOP of this job, which is far outside the log tail the API
          # returns -- so when that image had to be handed to someone to
          # flash, its size and hash were unreadable and the handover was
          # "check the Summary page yourself". One more line, dead last,
          # fixes that.
          if [ -f audit/stemtape_player-VOLCAL.bin ]; then
            VC_SIZE="$(stat -c '%s' audit/stemtape_player-VOLCAL.bin)"
            VC_SHA="$(sha256sum audit/stemtape_player-VOLCAL.bin | cut -d' ' -f1)"
            echo "VOLCAL bin=${VC_SIZE}B sha256=${VC_SHA}"
          else
            echo "VOLCAL bin=NOT-PRODUCED"
          fi



  # ==========================================================================
  # RELEASE REPORT -- a deliberately tiny job that exists for one reason: to
  # make the candidate binary's identity READABLE.
  #
  # The stemtape-player job already computes all of it, and printing it there
  # does not work. Only a job's log TAIL is reachable when artifact downloads
  # are blocked by egress policy (GitHub serves artifacts from
  # *.blob.core.windows.net, which the gateway refuses with 403 -- a policy
  # denial, not a transient), and that job's tail is consumed entirely by its
  # own post-job cleanup: saving the ccache cache alone outweighs the whole
  # readable budget, and it grows or shrinks run to run, so the release line
  # survived one run and was pushed out of reach on the next two.
  #
  # This job sets up nothing and caches nothing, so it has almost no cleanup
  # to emit. It pulls the artifact the build already uploaded (over GitHub's
  # own internal network, not through the proxy) and prints the identity as
  # the last thing in a nearly empty log. Nothing here is recomputed or
  # re-derived: same artifact, same bytes, same numbers -- just somewhere they
  # can actually be read.
  release-report:
    runs-on: ubuntu-latest
    needs: stemtape-player
    if: ${{ always() }}
    steps:
      - name: Download the stemtape-player audit artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: stemtape-player-audit
          path: audit-dl

      - name: Release identity
        run: |
          BIN=audit-dl/stemtape_player.bin
          LOG=audit-dl/build.log
          if [ -f "$BIN" ]; then
            SIZE="$(stat -c '%s' "$BIN")"
            SHA="$(sha256sum "$BIN" | cut -d' ' -f1)"
          else
            SIZE="NOT-PRODUCED"; SHA="NOT-PRODUCED"
          fi
          USED=""
          if [ -f "$LOG" ]; then
            grep -E '^ *(FLASH|RAM):' "$LOG" | tail -n 4 || true
            USED="$(grep -E '^ *RAM:' "$LOG" | tail -n1 | grep -oE '[0-9]+' | head -n1 || true)"
          fi
          echo "commit:   ${{ github.event.pull_request.head.sha || github.sha }}"
          echo "bin size: ${SIZE} bytes"
          echo "bin sha256: ${SHA}"
          if [ -n "$USED" ]; then
            echo "ram used: ${USED} bytes; ram free: $((262144 - USED)) bytes of 262144"
          fi
          echo "RELEASE commit=${{ github.event.pull_request.head.sha || github.sha }} bin=${SIZE}B sha256=${SHA} ram_used=${USED:-?} ram_free=$((262144 - ${USED:-0}))"
