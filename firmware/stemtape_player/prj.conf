# ---- Stem Tape Player: derived from the real Tape Looper's prj.conf ----
#
# src/main.c is now a real derivative of the proven firmware/src/main.c (see
# its provenance banner). USB device_next carries CDC console + class-
# compliant incoming USB-MIDI 2.0 (CONFIG_USBD_MIDI2_CLASS=y) only.
#
# STEM TAPE: UAC2 (USB audio class) playback -- CONFIG_USBD_AUDIO2_CLASS and
# its two feedback-workaround options below -- is REMOVED as of this change.
# Product decision: it was added earlier under the mistaken assumption that
# KO II cue control depended on it. Cue control actually uses incoming USB
# MIDI only, and song loading uses the companion's own transfer protocol
# over the CDC console (unaffected). Stored four-stem playback now
# exclusively owns the SP-1 audio output. See main.c's own top-of-file
# comment, and the CI "Effective configuration assertion" and "USB
# descriptor assertion" steps, which now prove CONFIG_USBD_AUDIO2_CLASS is
# unset and no UAC2 descriptor material is linked.
#
# Incoming MIDI drives KO II pad cue control via a standalone MIDI bridge;
# there is no outgoing MIDI and no MIDI clock in this slice. ADC (button
# ladders + faders), I2C (codec bring-up), I2S (audio out), watchdog, and
# the failsafes are all still needed, same as the classic looper. This file
# otherwise mirrors firmware/prj.conf (see that file for the per-option
# rationale comments); it does NOT invent any new Kconfig option beyond
# what firmware/prj.conf already proves builds and runs on this exact
# board, plus the MIDI2 option firmware/prj.conf itself documents.

CONFIG_PM=y
CONFIG_PM_DEVICE=n
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_IDLE_STACK_SIZE=128
CONFIG_ISR_STACK_SIZE=512
CONFIG_WATCHDOG=y

# ---- FAILSAFES: catch stack overflow / bad memory access cleanly (MPU guard +
# stack canary). Any fatal fault is turned into a reboot by k_sys_fatal_error_handler
# in main.c, and the 4 s watchdog is the final backstop for a hang. ----
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_REBOOT=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# ---- USB-serial diagnostics console (CDC ACM) ----
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ---- USB device_next: CDC console + incoming USB-MIDI only. ----
# SP1XFER!/xfer_service() still rides the CDC ACM console exactly as in
# the classic looper; every 'W'/'F'/'X' verb remains read-only-safe (see
# main.c). CONFIG_USBD_MIDI2_CLASS=y adds a class-compliant incoming-only
# USB-MIDI 2.0 endpoint (see app.overlay's usb_midi node and main.c's
# rx_packet_cb) -- no outgoing MIDI, no MIDI clock.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MIDI2_CLASS=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_HWINFO=y
# Distinct PID from both the classic looper (0x5210) and stock SP-1 firmware,
# so a host never caches the wrong driver/identity across firmware swaps.
CONFIG_SAMPLE_USBD_VID=0x1915
CONFIG_SAMPLE_USBD_PID=0x5211
CONFIG_SAMPLE_USBD_MANUFACTURER="softmodded"
CONFIG_SAMPLE_USBD_PRODUCT="Stem Tape Audio"
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
# STACK HIGH-WATER. Fills every thread stack with a known pattern at creation
# so k_thread_stack_space_get() can report how much has ever been touched.
# controls_diag() prints it on the STACK line. This exists because the RAM
# audit is not allowed to change a stack size from a guess: 12,672 bytes of
# stack are allocated across main/streamer/audio/midi/idle/ISR and none of
# those numbers has ever been measured against real use. Costs one memset per
# thread at boot and nothing at run time.
CONFIG_INIT_STACKS=y
CONFIG_SAMPLE_USBD_MAX_POWER=50

# ---- ADC for the button ladders / faders ----
CONFIG_ADC=y

# ---- I2C to the audio codecs (CS42L42 / TAS2505) ----
CONFIG_I2C=y

# ---- I2S audio out (nRF master) ----
CONFIG_I2S=y
CONFIG_I2S_NRFX=y
CONFIG_FPU=y
# See firmware/CMakeLists.txt's matching note: -O2 is unsafe for this
# codebase's mixer/eMMC timing (latent signed-overflow UB the classic looper
# already documents). Stay on the default -Os here too.

CONFIG_MAIN_STACK_SIZE=4096

# ---- Always-dim LEDs: the soft-PWM LED timer ISR (main.c's led_pwm_isr, on
# NRF_TIMER3) runs as a ZERO-LATENCY interrupt so kernel locks / other IRQs
# can't delay its on/off edges (edge jitter at low duty = visible flicker).
CONFIG_ZERO_LATENCY_IRQS=y
