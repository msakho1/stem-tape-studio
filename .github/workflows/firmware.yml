name: firmware

# Builds the untouched SP-1 Tape Looper firmware exactly as firmware/README.md
# specifies: Zephyr v4.3.1 + Zephyr SDK 0.17.4, the UAC2 Windows FS-feedback
# patch applied to the Zephyr tree, then a single west build.
#
# No job-level Docker container: the zephyrproject-rtos/ci image unpacks every
# toolchain (Xtensa included) and exhausts the runner disk. action-zephyr-setup
# installs only the arm-zephyr-eabi toolchain.
#
# Layout note: this repo stores the board definition inside the firmware folder
# (firmware/boards/teenageengineering/stem_player), so BOARD_ROOT points at
# firmware/ instead of the repo root. No firmware file is modified.

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Zephyr v4.3.1 + SDK 0.17.4 (arm-zephyr-eabi only)
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          base-path: project
          app-path: firmware
          toolchains: arm-zephyr-eabi
          sdk-version: 0.17.4

      - name: Apply documented Zephyr patch
        run: |
          set -eux
          cd zephyr
          git apply --verbose \
            "$GITHUB_WORKSPACE/project/firmware/patches/uac2-windows-fs-feedback.patch"

      - name: Build (west build -p -b stem_player firmware)
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/project"
          west build -p always -b stem_player firmware \
            -- -DBOARD_ROOT="$GITHUB_WORKSPACE/project/firmware"

      - name: Report artifact hash
        run: |
          set -eux
          cd project/build/zephyr
          cp zephyr.bin sp1_looper.bin
          ls -l sp1_looper.bin
          sha256sum sp1_looper.bin | tee "$GITHUB_STEP_SUMMARY"

      - name: Upload sp1_looper.bin
        uses: actions/upload-artifact@v4
        with:
          name: sp1_looper-bin
          path: project/build/zephyr/sp1_looper.bin
