name: firmware

# Builds the untouched SP-1 Tape Looper firmware exactly as firmware/README.md
# specifies: Zephyr v4.3.1 + Zephyr SDK 0.17.4, the UAC2 Windows FS-feedback
# patch applied to the Zephyr tree, then a single west build.
#
# Workspace layout (all paths are relative to $GITHUB_WORKSPACE):
#   project/           <- west workspace topdir (this repository)
#   project/zephyr/    <- Zephyr v4.3.1 checkout created by action-zephyr-setup
#   project/firmware/  <- Zephyr application + in-repo board + patches
#   project/build/     <- build output
#
# No job-level Docker container: the zephyrproject-rtos/ci image unpacks every
# toolchain (Xtensa included) and exhausts the runner disk. action-zephyr-setup
# installs only the arm-zephyr-eabi toolchain.

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      diagnostic_mode:
        description: >-
          Diagnostic CI run: disables ccache for the firmware build/link
          steps, builds with verbose Ninja output at -j2, and shortens the
          Set-up-Zephyr heartbeat interval to 30s. Does not change any
          firmware source, compiler flag, linker flag, safety-gate policy,
          or the golden Tape Looper target -- diagnostics and timing only.
        type: boolean
        default: false

# A newer push/PR update to the same branch cancels any run still in
# progress for it, so a stalled runner (e.g. wedged in Set up Zephyr) never
# keeps occupying a runner slot after it's already obsolete.
concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: project

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Start CI heartbeat (Set up Zephyr)
        # This composite action prints nothing while it downloads/unpacks
        # the SDK, so a genuine hang here is otherwise indistinguishable
        # from "just slow" until the job either finishes or is manually
        # cancelled. Runs detached in the background; stopped right after
        # the step it watches, whether that step succeeds, fails, or times
        # out (see the timeout-minutes on that step below).
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          INTERVAL=60
          if [ "${{ github.event.inputs.diagnostic_mode }}" = "true" ]; then
            INTERVAL=30
          fi
          nohup bash "$GITHUB_WORKSPACE/project/.github/scripts/ci_heartbeat.sh" \
            audit/heartbeat-zephyr-setup.log "$INTERVAL" \
            > audit/heartbeat-zephyr-setup.out 2>&1 &
          echo $! > /tmp/st_heartbeat_zephyr_setup.pid

      - name: Set up Zephyr v4.3.1 + SDK 0.17.4 (arm-zephyr-eabi only)
        timeout-minutes: 15
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a  # v1.0.15
        with:
          base-path: project
          app-path: firmware
          toolchains: arm-zephyr-eabi
          sdk-version: 0.17.4

      - name: Stop CI heartbeat (Set up Zephyr)
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/project
        run: |
          set -uo pipefail
          if [ -f /tmp/st_heartbeat_zephyr_setup.pid ]; then
            kill "$(cat /tmp/st_heartbeat_zephyr_setup.pid)" 2>/dev/null || true
          fi
          {
            echo '### Set up Zephyr heartbeat (build job)'
            echo '```text'
            cat audit/heartbeat-zephyr-setup.log 2>/dev/null || echo "(no heartbeat log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Path preflight
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          test -d zephyr
          test -f zephyr/VERSION
          test -d firmware
          test -f firmware/CMakeLists.txt
          test -d firmware/boards/teenageengineering/stem_player
          test -f firmware/patches/uac2-windows-fs-feedback.patch
          west topdir

      - name: Apply documented Zephyr patch
        working-directory: ${{ github.workspace }}/project/zephyr
        run: |
          set -eux
          git apply --verbose ../firmware/patches/uac2-windows-fs-feedback.patch

      - name: Configure (west build --cmake-only -b stem_player firmware)
        timeout-minutes: 10
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          command -v /usr/bin/time >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends time
          /usr/bin/time -v -o audit/configure-time.txt \
            west build -p always -b stem_player firmware --cmake-only \
              -- -DBOARD_ROOT="$GITHUB_WORKSPACE/project/firmware" \
                 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee audit/configure.log | tee audit/build.log

      - name: Compile & link (cmake --build)
        timeout-minutes: 20
        working-directory: ${{ github.workspace }}/project
        env:
          # NINJA_STATUS timestamps every completed build task -- see
          # https://ninja-build.org/manual.html#_environment_variables --
          # so normal builds already avoid multi-minute silent gaps without
          # needing verbose/-j2 (those are reserved for diagnostic_mode,
          # since they meaningfully slow the build down).
          NINJA_STATUS: "[%f/%t %es] "
        run: |
          set -euo pipefail
          BUILD_ARGS=(--parallel "$(nproc)")
          if [ "${{ github.event.inputs.diagnostic_mode }}" = "true" ]; then
            export CCACHE_DISABLE=1
            BUILD_ARGS=(--verbose --parallel 2)
          fi
          /usr/bin/time -v -o audit/compile-time.txt \
            cmake --build build "${BUILD_ARGS[@]}" \
            2>&1 | tee audit/compile.log | tee -a audit/build.log

      - name: Report artifact hash
        working-directory: ${{ github.workspace }}/project/build/zephyr
        run: |
          set -eux
          cp zephyr.bin sp1_looper.bin
          ls -l sp1_looper.bin
          sha256sum sp1_looper.bin | tee -a "$GITHUB_STEP_SUMMARY"

      # GOLDEN TAPE LOOPER (fail-closed): the physical unit's currently-
      # flashed binary was hashed off real hardware and confirmed byte-for-
      # byte identical to this job's own build output. That pairing (real
      # device <-> this exact CI build) is the hardware-proven baseline the
      # whole Stem Tape effort is derived from -- this step guarantees the
      # `firmware/` build stays pinned to it. It compares the FRESHLY
      # GENERATED build/zephyr/sp1_looper.bin from this run, never a
      # possibly-stale checked-in copy, and fails the job on any mismatch
      # (size or hash). It does not alter any Tape Looper source, board
      # file, patch, configuration, or compiler option.
      - name: Assert golden Tape Looper binary (fail-closed)
        working-directory: ${{ github.workspace }}/project/build/zephyr
        run: |
          set -euo pipefail
          EXPECT_SIZE=96232
          EXPECT_SHA256=5670391bbee6a3ebde2c0a15d35a2731faca8fdb165124efda91de6ba48c3a8d
          ACTUAL_SIZE=$(stat -c '%s' sp1_looper.bin)
          ACTUAL_SHA256=$(sha256sum sp1_looper.bin | awk '{print $1}')
          {
            echo '### Golden Tape Looper binary assertion'
            echo '```text'
            echo "expected size:   $EXPECT_SIZE"
            echo "actual size:     $ACTUAL_SIZE"
            echo "expected sha256: $EXPECT_SHA256"
            echo "actual sha256:   $ACTUAL_SHA256"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ok=1
          if [ "$ACTUAL_SIZE" != "$EXPECT_SIZE" ]; then
            echo "::error::sp1_looper.bin size $ACTUAL_SIZE != golden $EXPECT_SIZE"
            ok=0
          fi
          if [ "$ACTUAL_SHA256" != "$EXPECT_SHA256" ]; then
            echo "::error::sp1_looper.bin sha256 $ACTUAL_SHA256 != golden $EXPECT_SHA256"
            ok=0
          fi
          if [ "$ok" -ne 1 ]; then
            echo '### GOLDEN TAPE LOOPER ASSERTION FAILED -- build no longer matches the hardware-verified baseline' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "golden Tape Looper binary confirmed: size and SHA-256 match the hardware-verified baseline"

      - name: Upload sp1_looper.bin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sp1_looper-bin
          path: project/build/zephyr/sp1_looper.bin
          if-no-files-found: error

      - name: Upload build diagnostics (heartbeat + configure/compile logs and timing)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-diagnostics
          path: project/audit/**
          if-no-files-found: warn

  stemtape-m0:
    # Milestone M0: the Stem Tape raw USB-MIDI control surface. Same board,
    # same Zephyr revision and SDK; no Zephyr patch is needed (the UAC2
    # Windows feedback workaround only concerns the audio class, which M0
    # does not build).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: project

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Start CI heartbeat (Set up Zephyr)
        # See the `build` job's identical step for why: this composite
        # action prints nothing while it downloads/unpacks the SDK, so a
        # genuine hang is otherwise indistinguishable from "just slow".
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          INTERVAL=60
          if [ "${{ github.event.inputs.diagnostic_mode }}" = "true" ]; then
            INTERVAL=30
          fi
          nohup bash "$GITHUB_WORKSPACE/project/.github/scripts/ci_heartbeat.sh" \
            audit/heartbeat-zephyr-setup.log "$INTERVAL" \
            > audit/heartbeat-zephyr-setup.out 2>&1 &
          echo $! > /tmp/st_heartbeat_zephyr_setup.pid

      - name: Set up Zephyr v4.3.1 + SDK 0.17.4 (arm-zephyr-eabi only)
        timeout-minutes: 15
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a  # v1.0.15
        with:
          base-path: project
          app-path: firmware
          toolchains: arm-zephyr-eabi
          sdk-version: 0.17.4

      - name: Stop CI heartbeat (Set up Zephyr)
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/project
        run: |
          set -uo pipefail
          if [ -f /tmp/st_heartbeat_zephyr_setup.pid ]; then
            kill "$(cat /tmp/st_heartbeat_zephyr_setup.pid)" 2>/dev/null || true
          fi
          {
            echo '### Set up Zephyr heartbeat (stemtape-m0 job)'
            echo '```text'
            cat audit/heartbeat-zephyr-setup.log 2>/dev/null || echo "(no heartbeat log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Path preflight
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          test -d zephyr
          test -f firmware/stemtape/CMakeLists.txt
          test -f firmware/stemtape/src/main.c
          test -f firmware/stemtape/app.overlay
          test -f firmware/west.yml
          test -d firmware/boards/teenageengineering/stem_player
          west topdir

      - name: Provenance preflight (clean tree, frozen manifest, toolchain versions)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          # FAIL CLOSED: no untracked-or-modified tracked file may enter a build
          # whose artifact is used for approval decisions.
          git status --porcelain=v1 --untracked-files=no > audit/git-status.txt
          if [ -s audit/git-status.txt ]; then
            echo "tracked Git tree is dirty:" >&2
            cat audit/git-status.txt >&2
            exit 1
          fi
          git rev-parse HEAD                > audit/git-commit.txt
          git log -1 --stat                 > audit/git-log-head.txt
          west manifest --freeze            > audit/west-manifest-freeze.yml
          cp firmware/west.yml                audit/west.yml
          ( cd zephyr && git rev-parse HEAD && cat VERSION ) > audit/zephyr-revision.txt
          west list -f '{name} {path} {revision} {url}' > audit/west-modules.txt
          {
            echo "runner: $RUNNER_OS $RUNNER_ARCH"
            echo "python: $(python3 --version)"
            echo "west:   $(west --version)"
            echo "ZEPHYR_SDK_INSTALL_DIR=${ZEPHYR_SDK_INSTALL_DIR:-unset}"
            echo "sdk-version (workflow input): 0.17.4"
            echo "actions:"
            echo "  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1"
            echo "  actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0"
            echo "  actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1"
            echo "  zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a  # v1.0.15"
          } > audit/provenance.txt
          cat audit/provenance.txt audit/zephyr-revision.txt


      - name: Configure (west build --cmake-only -b stem_player firmware/stemtape)
        timeout-minutes: 10
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          command -v /usr/bin/time >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends time
          /usr/bin/time -v -o audit/configure-time.txt \
            west build -p always -b stem_player firmware/stemtape -d build-stemtape --cmake-only \
              -- -DBOARD_ROOT="$GITHUB_WORKSPACE/project/firmware" \
                 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee audit/configure.log | tee audit/build.log

      - name: Compile & link (cmake --build)
        timeout-minutes: 20
        working-directory: ${{ github.workspace }}/project
        env:
          NINJA_STATUS: "[%f/%t %es] "
        run: |
          set -euo pipefail
          BUILD_ARGS=(--parallel "$(nproc)")
          if [ "${{ github.event.inputs.diagnostic_mode }}" = "true" ]; then
            export CCACHE_DISABLE=1
            BUILD_ARGS=(--verbose --parallel 2)
          fi
          /usr/bin/time -v -o audit/compile-time.txt \
            cmake --build build-stemtape "${BUILD_ARGS[@]}" \
            2>&1 | tee audit/compile.log | tee -a audit/build.log

      - name: Collect toolchain analysis
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          CACHE=build-stemtape/CMakeCache.txt
          test -f "$CACHE"

          cmv() { sed -n "s|^$1:[^=]*=||p" "$CACHE" | tail -n1; }

          OBJDUMP="$(cmv CMAKE_OBJDUMP)"
          SIZE="$(cmv CMAKE_SIZE_UTIL)"
          NM="$(cmv CMAKE_NM)"
          READELF="$(cmv CMAKE_READELF)"
          OBJCOPY="$(cmv CMAKE_OBJCOPY)"

          if [ -z "$OBJDUMP" ]; then
            echo "CMAKE_OBJDUMP missing from $CACHE" >&2
            exit 1
          fi
          BINDIR="$(dirname "$OBJDUMP")"
          BASE="$(basename "$OBJDUMP")"
          PREFIX="${BASE%objdump}"
          [ -n "$SIZE" ]    || SIZE="$BINDIR/${PREFIX}size"
          [ -n "$NM" ]      || NM="$BINDIR/${PREFIX}nm"
          [ -n "$READELF" ] || READELF="$BINDIR/${PREFIX}readelf"
          [ -n "$OBJCOPY" ] || OBJCOPY="$BINDIR/${PREFIX}objcopy"

          for t in "$SIZE" "$OBJDUMP" "$NM" "$READELF" "$OBJCOPY"; do
            if [ ! -x "$t" ]; then
              echo "resolved binutils executable not found or not executable: $t" >&2
              exit 1
            fi
          done

          {
            echo "CMAKE_SIZE_UTIL = $SIZE"
            echo "CMAKE_OBJDUMP   = $OBJDUMP"
            echo "CMAKE_NM        = $NM"
            echo "CMAKE_READELF   = $READELF"
            echo "CMAKE_OBJCOPY   = $OBJCOPY"
            echo "compiler        = $("$(cmv CMAKE_C_COMPILER)" --version | head -n1)"
          } | tee audit/tool-paths.txt
          {
            echo '### M0 resolved binutils paths'
            echo '```text'
            cat audit/tool-paths.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Make the same toolchain directory available to later audit steps.
          echo "$BINDIR" >> "$GITHUB_PATH"

          set -x
          B=build-stemtape/zephyr
          cp "$B/zephyr.bin" "$B/stemtape_m0.bin"
          "$SIZE" -A -x "$B/zephyr.elf"          > audit/size.txt
          "$SIZE" "$B/zephyr.elf"               >> audit/size.txt
          "$OBJDUMP" -h "$B/zephyr.elf"          > audit/objdump-h.txt
          "$OBJDUMP" -d "$B/zephyr.elf"          > audit/objdump-d.txt
          "$NM" -n -S "$B/zephyr.elf"            > audit/nm.txt
          "$READELF" -W -S -l -h "$B/zephyr.elf" > audit/readelf.txt


      - name: Assertion self-test (each assertion must fail when violated)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/m0_assertions_selftest.py | tee audit/assertions-selftest.txt
          {
            echo '### M0 assertion self-test'
            echo '```text'
            grep -E '^\[|^SELF-TEST' audit/assertions-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: LED Feedback Protocol v1 host tests (no Zephyr/nRF toolchain)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Ifirmware/stemtape/src \
            firmware/stemtape/src/led_duty.c \
            firmware/stemtape/src/led_frame.c \
            firmware/stemtape/src/led_midi.c \
            firmware/stemtape/src/led_battery.c \
            firmware/stemtape/src/led_render_policy.c \
            firmware/stemtape/tests/test_led.c \
            -o audit/test_led
          ./audit/test_led | tee audit/led-selftest.txt
          {
            echo '### M0 LED Feedback Protocol v1 host tests'
            echo '```text'
            grep -E '^\[|^LED SELF-TEST' audit/led-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Image assertions (origin, bounds, storage, UICR, entry, vectors, size, BIN identity)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          CACHE=build-stemtape/CMakeCache.txt
          cmv() { sed -n "s|^$1:[^=]*=||p" "$CACHE" | tail -n1; }
          READELF="$(cmv CMAKE_READELF)"; OBJCOPY="$(cmv CMAKE_OBJCOPY)"
          OBJDUMP="$(cmv CMAKE_OBJDUMP)"; BINDIR="$(dirname "$OBJDUMP")"
          PREFIX="$(basename "$OBJDUMP")"; PREFIX="${PREFIX%objdump}"
          [ -n "$READELF" ] || READELF="$BINDIR/${PREFIX}readelf"
          [ -n "$OBJCOPY" ] || OBJCOPY="$BINDIR/${PREFIX}objcopy"
          python3 .github/scripts/m0_image_assertions.py \
            build-stemtape/zephyr/zephyr.elf \
            build-stemtape/zephyr/stemtape_m0.bin \
            --readelf "$READELF" --objcopy "$OBJCOPY" | tee audit/image-assertions.txt
          {
            echo '### M0 image assertions'
            echo '```text'
            grep -E '^\[(PASS|FAIL)\]|^ALL IMAGE' audit/image-assertions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persistent-memory and power audit report (descriptive)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/m0_persistence_audit.py \
            audit/nm.txt audit/persistence-audit.md > /dev/null
          echo "report written: audit/persistence-audit.md"

      - name: STRICT persistence safety gate (fail-closed)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/m0_safety_gate.py \
            audit/nm.txt audit/objdump-d.txt build-stemtape/zephyr/.config \
            audit/safety-gate.md 2>&1 | tee audit/safety-gate.txt
          gate_rc=${PIPESTATUS[0]}
          set -e
          {
            echo '### M0 strict persistence safety gate'
            echo '```text'
            cat audit/safety-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_rc"

      - name: Hashes and sources
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euxo pipefail
          B=build-stemtape/zephyr
          git diff                      > audit/git-diff.txt
          ( cd "$B" && sha256sum stemtape_m0.bin zephyr.bin zephyr.elf zephyr.hex 2>/dev/null || true ) \
            > audit/sha256.txt
          cp "$B/stemtape_m0.bin" "$B/zephyr.elf" "$B/zephyr.map" "$B/zephyr.dts" audit/
          cp "$B/.config" audit/config.txt
          cp build-stemtape/CMakeCache.txt audit/
          cp build-stemtape/compile_commands.json audit/ 2>/dev/null || true
          mkdir -p audit/src/stemtape audit/src/board audit/src/workflow audit/src/docs
          cp -r firmware/stemtape/. audit/src/stemtape/
          cp -r firmware/boards/teenageengineering/stem_player/. audit/src/board/
          cp firmware/west.yml audit/src/
          cp .github/workflows/firmware.yml audit/src/workflow/
          cp .github/scripts/m0_image_assertions.py \
             .github/scripts/m0_assertions_selftest.py \
             .github/scripts/m0_persistence_audit.py \
             .github/scripts/m0_safety_gate.py audit/src/workflow/
          cp docs/stem-tape-led-feedback-v1.md audit/src/docs/ 2>/dev/null || true
          stat -c '%n %s bytes' audit/stemtape_m0.bin | tee -a "$GITHUB_STEP_SUMMARY"
          cat audit/sha256.txt | tee -a "$GITHUB_STEP_SUMMARY"


      - name: Report USB interfaces in the M0 device
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          grep -E '^CONFIG_(USBD_MIDI2_CLASS|USBD_CDC_ACM_CLASS|USBD_AUDIO2_CLASS|USB_DEVICE_STACK_NEXT)=' \
            build-stemtape/zephyr/.config | tee audit/usb-interfaces.txt | tee -a "$GITHUB_STEP_SUMMARY"
          grep -A3 'usb_midi' build-stemtape/zephyr/zephyr.dts >> audit/usb-interfaces.txt || true

      - name: Upload stemtape-m0-audit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: stemtape-m0-audit
          path: project/audit/**
          if-no-files-found: error

  stemtape-player:
    # Stem Tape Player -- class-compliant incoming USB-MIDI 2.0 for KO II pad
    # cue control, plus the v1.1 A/B storage engine, on the derived four-stem
    # player (firmware/stemtape_player). Same board/Zephyr revision/SDK as
    # the other two targets. UAC2 (USB audio class) playback is REMOVED --
    # product decision: it was added earlier under the mistaken assumption
    # that KO II cue control depended on it; cue control actually uses
    # incoming USB MIDI only, and song loading uses the companion's own
    # transfer protocol over the CDC console. Stored four-stem playback now
    # exclusively owns the SP-1 audio output (see main.c's own top-of-file
    # comment). No Zephyr patch is needed for this job any more (the UAC2
    # Windows-feedback workaround only concerns the audio class, which this
    # target no longer builds -- same reasoning as the stemtape-m0 job
    # above). Storage still fails closed outside the validated v1.1 write
    # path -- no format-fresh, no metadata/settings persistence, no raw 'W'
    # write outside st_ab_session's gate, no recording, no route from MIDI
    # into eMMC -- see main.c's comments and the strict persistence safety
    # gate below for the exhaustive removal list.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: project

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Safety gate parser self-test (needs only Python, run before the SDK/build)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          python3 .github/scripts/stemtape_player_safety_gate_parser_selftest.py \
            | tee audit/safety-gate-parser-selftest.txt
          {
            echo '### STRICT persistence safety gate: function-name parser self-test'
            echo '```text'
            grep -E '^\[|^[0-9]+ checks|^PARSER' audit/safety-gate-parser-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start CI heartbeat (Set up Zephyr)
        # See the `build` job's identical step for why: this composite
        # action prints nothing while it downloads/unpacks the SDK, so a
        # genuine hang is otherwise indistinguishable from "just slow".
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          INTERVAL=60
          if [ "${{ github.event.inputs.diagnostic_mode }}" = "true" ]; then
            INTERVAL=30
          fi
          nohup bash "$GITHUB_WORKSPACE/project/.github/scripts/ci_heartbeat.sh" \
            audit/heartbeat-zephyr-setup.log "$INTERVAL" \
            > audit/heartbeat-zephyr-setup.out 2>&1 &
          echo $! > /tmp/st_heartbeat_zephyr_setup.pid

      - name: Set up Zephyr v4.3.1 + SDK 0.17.4 (arm-zephyr-eabi only)
        timeout-minutes: 15
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a  # v1.0.15
        with:
          base-path: project
          app-path: firmware
          toolchains: arm-zephyr-eabi
          sdk-version: 0.17.4

      - name: Stop CI heartbeat (Set up Zephyr)
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/project
        run: |
          set -uo pipefail
          if [ -f /tmp/st_heartbeat_zephyr_setup.pid ]; then
            kill "$(cat /tmp/st_heartbeat_zephyr_setup.pid)" 2>/dev/null || true
          fi
          {
            echo '### Set up Zephyr heartbeat (stemtape-player job)'
            echo '```text'
            cat audit/heartbeat-zephyr-setup.log 2>/dev/null || echo "(no heartbeat log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Path preflight
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          test -d zephyr
          test -f firmware/stemtape_player/CMakeLists.txt
          test -f firmware/stemtape_player/src/main.c
          test -f firmware/stemtape_player/app.overlay
          test -f firmware/west.yml
          test -d firmware/boards/teenageengineering/stem_player
          west topdir

      - name: Provenance preflight (clean tree, frozen manifest, toolchain versions)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          git status --porcelain=v1 --untracked-files=no > audit/git-status.txt
          if [ -s audit/git-status.txt ]; then
            echo "tracked Git tree is dirty:" >&2
            cat audit/git-status.txt >&2
            exit 1
          fi
          git rev-parse HEAD                > audit/git-commit.txt
          git log -1 --stat                 > audit/git-log-head.txt
          west manifest --freeze            > audit/west-manifest-freeze.yml
          cp firmware/west.yml                audit/west.yml
          ( cd zephyr && git rev-parse HEAD && cat VERSION ) > audit/zephyr-revision.txt
          west list -f '{name} {path} {revision} {url}' > audit/west-modules.txt

      - name: Configure (west build --cmake-only -b stem_player firmware/stemtape_player)
        timeout-minutes: 10
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          command -v /usr/bin/time >/dev/null 2>&1 || sudo apt-get install -y --no-install-recommends time
          /usr/bin/time -v -o audit/configure-time.txt \
            west build -p always -b stem_player firmware/stemtape_player -d build-stemtape-player --cmake-only \
              -- -DBOARD_ROOT="$GITHUB_WORKSPACE/project/firmware" \
                 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee audit/configure.log | tee audit/build.log

      - name: Compile & link (cmake --build)
        timeout-minutes: 20
        working-directory: ${{ github.workspace }}/project
        env:
          # RAM budget assertion below reads the "Memory region ... RAM:"
          # line ninja prints as part of the final link -- captured here in
          # audit/compile.log (and appended into the combined audit/build.log
          # the RAM budget step actually greps, so that step needs no
          # change).
          NINJA_STATUS: "[%f/%t %es] "
        run: |
          set -euo pipefail
          BUILD_ARGS=(--parallel "$(nproc)")
          if [ "${{ github.event.inputs.diagnostic_mode }}" = "true" ]; then
            export CCACHE_DISABLE=1
            BUILD_ARGS=(--verbose --parallel 2)
          fi
          /usr/bin/time -v -o audit/compile-time.txt \
            cmake --build build-stemtape-player "${BUILD_ARGS[@]}" \
            2>&1 | tee audit/compile.log | tee -a audit/build.log

      - name: RAM budget assertion (fail-closed)
        # PHASE 1 must fit in a real, measured RAM budget: max 229,376 bytes
        # used (256 KiB region minus a required 32 KiB free), leaving real
        # headroom for runtime stack/audio-buffer behavior. Reads west's own
        # "Memory region ... Used Size" report already captured in
        # audit/build.log by the Build step above -- the same authoritative
        # number `west build` itself computed from the real linked ELF, not
        # a re-derived estimate.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          MAX_USED=229376
          RAM_LINE="$(grep -E '^ *RAM:' audit/build.log | tail -n1)"
          if [ -z "$RAM_LINE" ]; then
            echo "could not find a 'RAM:' memory-region line in audit/build.log" >&2
            exit 1
          fi
          USED="$(echo "$RAM_LINE" | grep -oE '[0-9]+' | head -n1)"
          FREE=$((262144 - USED))
          {
            echo '### Stem Tape Player RAM budget'
            echo '```text'
            echo "$RAM_LINE"
            echo "used:   $USED bytes"
            echo "budget: $MAX_USED bytes max"
            echo "free:   $FREE bytes (region 262144 bytes total)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$USED" -gt "$MAX_USED" ]; then
            echo "::error::RAM used ($USED bytes) exceeds the Phase 1 budget ($MAX_USED bytes)"
            exit 1
          fi
          if [ "$FREE" -lt 32768 ]; then
            echo "::error::RAM free ($FREE bytes) is below the required 32 KiB minimum"
            exit 1
          fi
          echo "RAM budget OK: $USED bytes used, $FREE bytes free"

      - name: Collect toolchain analysis
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          CACHE=build-stemtape-player/CMakeCache.txt
          test -f "$CACHE"

          cmv() { sed -n "s|^$1:[^=]*=||p" "$CACHE" | tail -n1; }

          OBJDUMP="$(cmv CMAKE_OBJDUMP)"
          SIZE="$(cmv CMAKE_SIZE_UTIL)"
          NM="$(cmv CMAKE_NM)"
          READELF="$(cmv CMAKE_READELF)"
          OBJCOPY="$(cmv CMAKE_OBJCOPY)"

          if [ -z "$OBJDUMP" ]; then
            echo "CMAKE_OBJDUMP missing from $CACHE" >&2
            exit 1
          fi
          BINDIR="$(dirname "$OBJDUMP")"
          BASE="$(basename "$OBJDUMP")"
          PREFIX="${BASE%objdump}"
          [ -n "$SIZE" ]    || SIZE="$BINDIR/${PREFIX}size"
          [ -n "$NM" ]      || NM="$BINDIR/${PREFIX}nm"
          [ -n "$READELF" ] || READELF="$BINDIR/${PREFIX}readelf"
          [ -n "$OBJCOPY" ] || OBJCOPY="$BINDIR/${PREFIX}objcopy"

          for t in "$SIZE" "$OBJDUMP" "$NM" "$READELF" "$OBJCOPY"; do
            if [ ! -x "$t" ]; then
              echo "resolved binutils executable not found or not executable: $t" >&2
              exit 1
            fi
          done

          {
            echo "CMAKE_SIZE_UTIL = $SIZE"
            echo "CMAKE_OBJDUMP   = $OBJDUMP"
            echo "CMAKE_NM        = $NM"
            echo "CMAKE_READELF   = $READELF"
            echo "CMAKE_OBJCOPY   = $OBJCOPY"
            echo "compiler        = $("$(cmv CMAKE_C_COMPILER)" --version | head -n1)"
          } | tee audit/tool-paths.txt

          echo "$BINDIR" >> "$GITHUB_PATH"

          set -x
          B=build-stemtape-player/zephyr
          cp "$B/zephyr.bin" "$B/stemtape_player.bin"
          "$SIZE" -A -x "$B/zephyr.elf"          > audit/size.txt
          "$SIZE" "$B/zephyr.elf"               >> audit/size.txt
          "$OBJDUMP" -h "$B/zephyr.elf"          > audit/objdump-h.txt
          "$OBJDUMP" -d "$B/zephyr.elf"          > audit/objdump-d.txt
          "$NM" -n -S "$B/zephyr.elf"            > audit/nm.txt
          "$READELF" -W -S -l -h "$B/zephyr.elf" > audit/readelf.txt

      - name: Stem Tape Player host tests (no Zephyr/nRF toolchain)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_crc32.c \
            firmware/stemtape_player/src/st_storage_layout.c \
            firmware/stemtape_player/src/st_sector_codec.c \
            firmware/stemtape_player/src/st_stem_validate.c \
            firmware/stemtape_player/src/st_transfer.c \
            firmware/stemtape_player/src/st_gesture.c \
            firmware/stemtape_player/src/st_scrub.c \
            firmware/stemtape_player/src/st_led_pattern.c \
            firmware/stemtape_player/src/st_midi_queue.c \
            firmware/stemtape_player/src/st_library_io.c \
            firmware/stemtape_player/src/st_xfer_wire.c \
            firmware/stemtape_player/tests/test_stemtape_player.c \
            -lm -o audit/test_stemtape_player
          ./audit/test_stemtape_player | tail -c 4000 | tee audit/stemtape-player-selftest.txt
          {
            echo '### Stem Tape Player host tests'
            echo '```text'
            tail -n 20 audit/stemtape-player-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape v1.1 fixture conformance (byte-exact vs the frozen handoff bundle)
        # Migration step 3+4: proves st_sector_v11.c (the STSC sector codec)
        # and st_checksum32.c (FNV-1a) decode the companion's REAL,
        # committed handoff/v1.1/binaries/*.bin fixtures byte-for-byte and
        # sample-for-sample -- every expected value in
        # tests/test_stem_v11.c is either copied verbatim from
        # handoff/v1.1/decoded/*.json or independently hand-verified
        # against the raw fixture bytes before being hardcoded, never
        # generated by this codec itself. Also exercises st_ab_session.c,
        # the STATEFUL A/B write-safety session gate (a frozen per-transfer
        # inactive song/index destination pair, not a stateless "is this
        # address in any of the four regions" check): negative host tests
        # prove writes to the active song, active index, unrelated storage,
        # the wrong inactive slot, an invalid generation, and an invalid
        # commit record are all rejected, alongside the positive commit and
        # single-use-closure path. Runs from the repo root so the test's
        # relative handoff/v1.1/binaries/ paths resolve; needs only a C
        # compiler (no Zephyr/SDK), so it runs alongside the other host
        # tests, before any Zephyr-specific step.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_crc32.c \
            firmware/stemtape_player/src/st_checksum32.c \
            firmware/stemtape_player/src/st_sector_v11.c \
            firmware/stemtape_player/src/st_stix.c \
            firmware/stemtape_player/src/st_stcp.c \
            firmware/stemtape_player/src/st_ab_session.c \
            firmware/stemtape_player/tests/test_stem_v11.c \
            -o audit/test_stem_v11
          ./audit/test_stem_v11 | tee audit/stem-v11-fixture-selftest.txt
          {
            echo '### Stem Tape v1.1 fixture conformance'
            echo '```text'
            cat audit/stem-v11-fixture-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape bulk upload wire contract + sequence state (host tests)
        # Upload-reliability phase: st_bulk_xfer.c is the pure wire-contract
        # parser/builder and per-session sequence state machine behind the
        # 'U' bulk verified-sector command (see st_bulk_xfer.h's own doc and
        # docs/stem-tape-bulk-upload-v1.md). Linked into the real firmware
        # target since Slice C2 (main.c's xfer_bulk_write_sector() calls
        # these same functions) -- this step host-tests the pure module
        # directly, exercising a REAL frozen sector from handoff/v1.1/
        # binaries/song-sectors-four-stem.bin through the real request
        # parser and CRC-32 path, never a fabricated fixture.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_crc32.c \
            firmware/stemtape_player/src/st_bulk_xfer.c \
            firmware/stemtape_player/tests/test_bulk_xfer.c \
            -o audit/test_bulk_xfer
          ./audit/test_bulk_xfer | tee audit/bulk-xfer-selftest.txt
          {
            echo '### Stem Tape bulk upload wire contract + sequence state'
            echo '```text'
            cat audit/bulk-xfer-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape bulk upload long-run walk (31,814-sector real scale)
        # Slice C3 verification: mirrors xfer_bulk_write_sector()'s own real
        # call sequence (header parse -> CRC -> st_bulk_seq_check() ->
        # st_ab_session_check_write() per block -> write -> read-back -> CRC
        # verify -> st_bulk_seq_advance()) at the real benchmark song's exact
        # scale -- 31,814 sectors = 509,024 physical blocks, the same numbers
        # the phase directive's own physical failure report uses -- via a
        # mock eMMC that remembers only the single most-recently-written
        # 8192-byte sector (O(1) memory, no 248.5 MiB fixture). Every pure
        # function called is the exact same one main.c's real
        # xfer_bulk_write_sector() calls, never a reimplementation.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_crc32.c \
            firmware/stemtape_player/src/st_checksum32.c \
            firmware/stemtape_player/src/st_sector_v11.c \
            firmware/stemtape_player/src/st_stix.c \
            firmware/stemtape_player/src/st_stcp.c \
            firmware/stemtape_player/src/st_ab_session.c \
            firmware/stemtape_player/src/st_bulk_xfer.c \
            firmware/stemtape_player/tests/test_bulk_xfer_walk.c \
            -o audit/test_bulk_xfer_walk
          ./audit/test_bulk_xfer_walk | tee audit/bulk-xfer-walk-selftest.txt
          {
            echo '### Stem Tape bulk upload long-run walk (31,814 real-scale sectors)'
            echo '```text'
            cat audit/bulk-xfer-walk-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape v1.1 wire-transcript replay (real recorded tx/rx bytes)
        # Directive step 8's transcript fixtures: handoff/v1.1/transcripts/
        # *.json are REAL, byte-for-byte recorded P/Q/R/W/F wire sessions
        # (SHA-256-verified against handoff/v1.1/SHA256SUMS.txt by
        # gen_transcript_bin.py BEFORE this ever compiles -- a corrupted or
        # substituted transcript fails closed right here, never reaching
        # replay). test_stem_v11_transcripts.c replays every recorded byte
        # against the SAME real st_ab_session.c/st_stix.c/st_stcp.c
        # functions main.c's 'Q'/'R'/'W'/'F' handlers call -- see that
        # file's own doc comment for exactly what is and isn't
        # reimplemented here (nothing that makes a decision; only wire
        # framing and the same short call-order any real caller needs).
        #
        # Covers five of the six required transcripts (the sixth,
        # corrupt-newest-index-fallback.json, is not a wire transcript --
        # it has no `entries` field -- and is instead exercised by
        # test_stem_v11.c's own test_corrupt_newest_index_fallback(), run
        # by the "Stem Tape v1.1 fixture conformance" step above):
        #   - upload-1-successful.json, upload-2-successful.json: the two
        #     successful-upload transcripts, replayed back-to-back on one
        #     continuous mock device, matching upload-2's own "over the
        #     same storage after a reconnect".
        #   - interrupted-before-magic.json: replayed on top of the
        #     upload-1-successful.json checkpoint; ends on a dangling,
        #     never-acked write of the UNCOMMITTED (magic=0) index draft.
        #     The harness's replay_transcript() recognizes a transcript's
        #     own final dangling tx-only entry as a legitimate recorded
        #     interruption (not a check failure) and still applies the
        #     real st_ab_session_check_write() decision to the mock
        #     device for its real side effect -- proving the active index/
        #     song pair is byte-for-byte untouched by this interruption.
        #   - magic-applied-ack-lost.json: same shape, but its dangling
        #     final write carries the REAL commit magic (0x53544958,
        #     "STIX") -- durably applied even though its own ack was lost
        #     on the wire, matching its declared afterReconnect generation
        #     3 (the same outcome upload-2-successful.json's own
        #     fully-acked replay independently reaches).
        #   - torn-invalid-magic.json: its magic-committing write is
        #     directly verified (recomputed CRC-32 over the recorded
        #     payload) to be complete, valid, and fully acknowledged --
        #     replayed and byte-checked in full; only the transcript's
        #     trailing 'F' dangles. Its declared afterReconnect (generation
        #     2 persisting, citing a corrupted CRC never actually present
        #     in the transmitted bytes) describes a hardware-layer torn-
        #     write fault injected AFTER a valid wire exchange -- outside
        #     what a host-level replay of the actual recorded bytes can
        #     prove or reproduce (same category as magic-write-cases.
        #     json's already-published "case F"). This step instead proves
        #     the honest, provable claim: given exactly what was
        #     transmitted, the real selector correctly commits generation
        #     3 -- see test_torn_invalid_magic()'s own doc comment.
        #   - handoff/v1.1/reports/interruption-sweep.json: an exhaustive
        #     146-point sweep (before/after each of 73 real protocol
        #     operations) over a single replacement upload, reproduced
        #     with zero fabricated bytes -- the 73 operations are
        #     upload-2-successful.json's own real recorded tx bytes,
        #     confirmed op-for-op identical (command, block address,
        #     order) to the fixture's own declared op/phase/block table
        #     before this step was written; the 146 expected (op, when,
        #     active, generation) values are mechanically transcribed from
        #     the real JSON by gen_interruption_sweep_expected.py. See
        #     test_interruption_sweep_matches_fixture()'s own doc comment.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p build-transcripts
          python3 firmware/stemtape_player/tests/gen_transcript_bin.py . \
            upload-1-successful build-transcripts/upload-1-successful.bin
          python3 firmware/stemtape_player/tests/gen_transcript_bin.py . \
            upload-2-successful build-transcripts/upload-2-successful.bin
          python3 firmware/stemtape_player/tests/gen_transcript_bin.py . \
            interrupted-before-magic build-transcripts/interrupted-before-magic.bin
          python3 firmware/stemtape_player/tests/gen_transcript_bin.py . \
            magic-applied-ack-lost build-transcripts/magic-applied-ack-lost.bin
          python3 firmware/stemtape_player/tests/gen_transcript_bin.py . \
            torn-invalid-magic build-transcripts/torn-invalid-magic.bin
          python3 firmware/stemtape_player/tests/gen_interruption_sweep_expected.py . \
            build-transcripts/interruption-sweep-expected.bin
          cc -std=c11 -Wall -Wextra -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_crc32.c \
            firmware/stemtape_player/src/st_checksum32.c \
            firmware/stemtape_player/src/st_sector_v11.c \
            firmware/stemtape_player/src/st_stix.c \
            firmware/stemtape_player/src/st_stcp.c \
            firmware/stemtape_player/src/st_ab_session.c \
            firmware/stemtape_player/tests/test_stem_v11_transcripts.c \
            -o audit/test_stem_v11_transcripts
          ./audit/test_stem_v11_transcripts audit/transcript-replay-results.json \
            | tee audit/stem-v11-transcript-replay.txt
          {
            echo '### Stem Tape v1.1 wire-transcript replay'
            echo '```text'
            cat audit/stem-v11-transcript-replay.txt
            echo '```'
            echo '#### Machine-readable result'
            echo '```json'
            cat audit/transcript-replay-results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape v1.1 stem mixdown host tests
        # Phase 2 (real four-stem playback engine): src/st_stem_mix.c's
        # own pure fixed-point 4-stem-to-stereo mixdown -- see that
        # file's own doc comment. As of Phase 2 slice 2 this module IS
        # linked into the real firmware target (CMakeLists.txt) and
        # genuinely called from main.c's looper_audio_block() -- proven
        # by the runtime symbol-presence gate and the "stored four-stem
        # playback wiring check" step below, not merely by this host-test
        # step, which only re-proves the pure mixdown arithmetic itself
        # in isolation (no Zephyr/nRF toolchain needed for that part).
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_sector_v11.c \
            firmware/stemtape_player/src/st_stem_mix.c \
            firmware/stemtape_player/tests/test_stem_mix.c \
            -o audit/test_stem_mix
          ./audit/test_stem_mix | tee audit/stem-mix-selftest.txt
          {
            echo '### Stem Tape v1.1 stem mixdown host tests'
            echo '```text'
            cat audit/stem-mix-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape v1.1 beat-sync LED host tests (Phase 3)
        # Phase 3 control-matrix, beat-sync LED slice: src/st_beat_phase.c's
        # own pure, RAM-only beat-phase computation (see that file's own
        # doc comment). Linked into the real firmware target
        # (CMakeLists.txt) and genuinely called: main.c's own streamer_
        # thread() boot code publishes the timing snapshot from the
        # selected STIX record's own bpm_q8/downbeat_frame (cross-checked
        # against the first sector's own header for consistency),
        # looper_audio_block() publishes the master song-position mirror
        # once per block, and led_service() calls st_beat_phase_on_beat()/
        # st_beat_led_decide() every control pass -- proven by the "stored
        # four-stem playback wiring check" step below, not merely by this
        # host-test step, which only re-proves the pure timing/decision
        # arithmetic itself in isolation (no Zephyr/nRF toolchain, no real
        # time source needed for that part -- every bpm_q8/song_frame
        # value here is fabricated TIMING, not fabricated audio content;
        # see test_beat_phase.c's own doc comment on why that is not the
        # fabrication this suite's rule forbids). Covers BPM/rounding,
        # downbeat offset, frames-before-downbeat, loop-wrap boundaries,
