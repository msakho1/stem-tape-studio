# ---- Stem Tape M0: raw USB-MIDI control surface ----
CONFIG_PM_DEVICE=n
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_USE_SEGGER_RTT=n

# ---- FAILSAFES (unchanged from the looper build) ----
CONFIG_HW_STACK_PROTECTION=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# ---- USB: device_next stack, MIDI 2.0 class (class-compliant) + CDC console --
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MIDI2_CLASS=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_HWINFO=y
CONFIG_SAMPLE_USBD_VID=0x1915
CONFIG_SAMPLE_USBD_PID=0x5211
CONFIG_SAMPLE_USBD_MANUFACTURER="softmodded"
CONFIG_SAMPLE_USBD_PRODUCT="Stem Tape SP-1"
# iOS/iPadOS reject accessories claiming more than 100 mA over the camera
# adapter; the SP-1 runs from its own battery (units of 2 mA).
CONFIG_SAMPLE_USBD_MAX_POWER=50

# ---- console over USB CDC ACM ----
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ---- controls ----
CONFIG_ADC=y

CONFIG_MAIN_STACK_SIZE=4096

# Always-dim LED soft-PWM ISR runs zero-latency so its edges never jitter.
CONFIG_ZERO_LATENCY_IRQS=y
