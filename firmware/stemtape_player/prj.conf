# ---- Stem Tape standalone player: boot/safety/LED skeleton ----
#
# This target currently boots the board, proves the watchdog/power/DFU/LED
# primitives it reuses from the SP-1 Tape Looper and M0 targets, and renders
# the local LED semantic pattern (st_led_pattern.h) with placeholder inputs.
# It intentionally does NOT yet enable USB audio, the eMMC driver, or the
# audio codecs -- the real-time playback/mixing/FX engine and the
# transfer-protocol eMMC binding are the next integration pass. See the
# firmware README's "Deferred beyond this release" section.

CONFIG_PM_DEVICE=n
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_USE_SEGGER_RTT=n

# ---- FAILSAFES (same as every other target in this repository) ----
CONFIG_HW_STACK_PROTECTION=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# ---- USB (companion transfer connection) is DEFERRED in this skeleton,
# along with the eMMC/codec/audio engine it serves -- not enabled here to
# keep this pass's buildable surface to only what is actually exercised.
# The RTT/semihosting-free printk below is for the board's own debug UART,
# not a host connection.
CONFIG_PRINTK=y
CONFIG_SERIAL=y

# ---- controls (DFU-escape ladder read only in this skeleton) ----
CONFIG_ADC=y

# ---- LED renderer: hardware PWM2/PWM3, same as the M0 target ----
CONFIG_PWM=y

CONFIG_MAIN_STACK_SIZE=4096
