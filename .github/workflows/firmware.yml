      - name: Stem Tape global loop engine host tests (grammar, lengths, exit)
        # src/st_loop.c is the pure global-loop transport: window capture,
        # the musical length ladder, the FUNCTION-latch / PLAY-unlatch
        # grammar and the exact exit position.
        #
        # NOT LINKED INTO THE FIRMWARE BY THIS COMMIT, deliberately and
        # temporarily. This target's established policy (see CMakeLists.txt's
        # own st_stem_stream.c slice-3A/3B note) is that a module may land
        # host-tested and unlinked in one slice provided the NEXT slice gives
        # it its real caller -- and that the unlinked state is stated rather
        # than left to be discovered. The production wiring commit adds it to
        # target_sources() together with its call sites; until then it costs
        # zero flash and zero RAM, and nothing in the firmware can reach it.
        #
        # LENGTH PROVENANCE, and one deliberate divergence.
        # src/machine/surface.ts:939 carries the web app's own authoritative
        # global-loop table -- `order: (1|2|4|8)[] = [1, 2, 4, 8]`, read as
        # bar fractions 1/1, 1/2, 1/4, 1/8, defaulting to a whole bar. All
        # four of those lengths appear in st_loop_lengths[] (1 bar, 2 beats,
        # 1 beat, 1/2 beat) and the default is the same whole bar, so the
        # firmware ladder is a SUPERSET of the shipped web model rather than
        # a competing one. The divergence is direction: surface.ts steps
        # `dir > 0` toward a larger division, making its Volume + SHORTEN the
        # loop, where the product instruction for this firmware is that
        # Volume + LENGTHENS. That is implemented as instructed; anyone
        # reconciling the two should change surface.ts.
        #
        # Every length is an exact multiple/divisor of the song's OWN beat,
        # derived from the selected STIX record's bpm_q8 through the real
        # st_beat_timing_init() -- no wall clock, no tempo detection, no
        # floating point. A song with no trustworthy tempo refuses to loop
        # rather than inventing a length, and a window that would run past
        # the committed song end is clamped; both are asserted here.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_loop.c \
            firmware/stemtape_player/src/st_beat_phase.c \
            firmware/stemtape_player/tests/test_st_loop.c \
            -o audit/test_st_loop
          ./audit/test_st_loop | tee audit/loop-engine-selftest.txt
          {
            echo '### Stem Tape global loop engine'
            echo '```text'
            cat audit/loop-engine-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No calibration capture in the production image
        # The temporary st16-cal build added a rate-limited CDC capture of the
        # Track/PLAY ladder so the real bands could be measured on hardware.
        # That measurement is done and committed
        # (firmware/stemtape_player/docs/ladder-measured.json); the capture,
        # its ST_CAL_BUILD switch and its calibration tag are all gone.
        #
        # It must never come back by accident. Beyond the diagnostic spam, an
        # extra blocking ladder_read() on the control thread is exactly what
        # starved the eMMC streamer once before, and the capture could only
        # ever run with the transport STOPPED -- which is precisely why it
        # could not observe the playing-state coupling that made chords fail.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          M=firmware/stemtape_player/src/main.c
          SHIP_BIN=build-stemtape-player/zephyr/zephyr.bin
          # THE BUILD TAG IS CHECKED IN THE LINKED IMAGE, NOT IN THE SOURCE
          # TEXT. src/main.c defines ST_BUILD_TAG under `#if ST_VOL_CAL`, so
          # it legitimately contains BOTH "stNN-VOLCAL" and "stNN". The old
          # check here was `grep -oE '^#define ST_BUILD_TAG ...' | head -1`,
          # which takes whichever branch is written first in the file -- the
          # calibration one -- and then fails a perfectly good production
          # build for containing "cal". grep cannot evaluate the
          # preprocessor, so it is the wrong tool for this question.
          #
          # The linked binary can only contain the branch that was actually
          # compiled. Asking it turns a guess about source text into a fact
          # about the artifact that ships. Stated as absence, so it does not
          # depend on picking the right string out of the binary: NO string
          # in the production image may look like a calibration tag.
          if [ ! -f "$SHIP_BIN" ]; then
            echo "FAIL: $SHIP_BIN is missing -- cannot check the production build tag"
            exit 1
          fi
          CAL_TAGS="$(strings "$SHIP_BIN" | grep -xiE 'st[0-9]+-.*cal.*' | sort -u || true)"
          if [ -n "$CAL_TAGS" ]; then
            echo "FAIL: the production image carries a calibration build tag:"
            printf '%s\n' "$CAL_TAGS"
            exit 1
          fi
          echo "OK: no calibration build tag in $SHIP_BIN"
          for sym in ST_CAL_BUILD cal_service cal_mask_str; do
            if grep -qn "$sym" "$M"; then
              echo "FAIL: $sym is still present in the production image."
              grep -n "$sym" "$M"
              exit 1
            fi
          done
          if grep -qn 'printk("CAL ' "$M"; then
            echo "FAIL: calibration logging is still present."
            exit 1
          fi
          echo "OK: production tag, no calibration switch, no capture, no CAL logging."

      - name: Stem Tape LOOP playback gate -- contiguous wrap, exit, zero silence
        # The production-equivalent gate for global looping. Drives the REAL
        # st_loop_*/st_stream_* functions through the SAME sequence of
        # operations stem_audio_block() performs -- the same window clamp, the
        # same st_stream_seek() wrap, the same one-shot exit -- over a real
        # 4000-sector song geometry, and checks the emitted FRAME SEQUENCE
        # rather than any internal flag.
        #
        # What it establishes:
        #   - every frame-to-frame step is +1 or the exact wrap from end-1 to
        #     start: no frame skipped, none repeated, none duplicated;
        #   - the exit resumes at exactly loop_end going forward, and is
        #     checked against each wrong answer individually (not zero, not
        #     loop_start -- the st15 rule that made the looped bar play through
        #     a second time on hardware -- not a sector boundary, not the live
        #     position), with nothing from [start, end) ever heard again;
        #   - ZERO silent frames, across every one of the four divisions.
        #     stem_audio_block() writes silence when the needed sector is
        #     missing, so "no silence" is the real no-dropout property here,
        #     not a proxy for it;
        #   - THE PIN DEPTH IS MEASURED, not asserted: the last case puts the
        #     exit target on the last frame of its sector -- the worst case the
        #     depth is sized against -- and injects the full 10.15 ms producer
        #     stall (streamer mid-read when the seek lands). Depth 3 emits zero
        #     silent frames; the identical case at depth 2 emits 427. That is
        #     the evidence for "the exit sector plus one more is not enough".
        #
        # THE NEGATIVE CONTROL IS THE POINT of the third case: the identical
        # exit with the pinned sectors removed DOES emit silence. The three
        # pinned buffers are justified by that demonstration rather than by
        # assertion. The arithmetic behind their depth: the ring maps sector s
        # to slot (s % 12) so it holds a sliding 11-sector window, while the
        # SHORTEST musical loop (1/4 beat at 120 BPM) already spans 17.6
        # sectors -- so loop_start's sector is always evicted, and reserving
        # its slot instead would collide with sectors s+12, s+24 ... which are
        # inside the loop too.
        #
        # This gate also caught a real defect during development. An earlier
        # version pointed the read-ahead at the loop's start sector as the
        # window end approached, so the wrap would arrive resident. On this
        # ring that is wrong: sector s and s+12 share a slot, and both are live
        # inside a loop, so prefetching the post-wrap region EVICTED the
        # pre-wrap region the playhead had not reached. The gate reported it
        # exactly -- "needs sector 18, slot 6 holds sector 6" -- and the
        # read-ahead now stays in song order, with the pin covering the seam.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          # THE GEOMETRY IS DERIVED, so the gate's job changed: it no longer
          # compares two hand-written numbers, it proves neither side has a
          # hand-written number at all. Every depth must reference
          # src/st_latency.h's derived macros, because that header is where
          # the one storage-latency model lives and where a change to the
          # guarantee has to be argued.
          M=firmware/stemtape_player/src/main.c
          T=firmware/stemtape_player/tests/test_loop_playback_gate.c
          B=firmware/stemtape_player/src/st_stem_bufmbox.h
          fail=0
          want() {  # file, macro, required right-hand side
            got="$(grep -oE "^#define $2[[:space:]]+.*" "$1" | head -1 \
                   | sed -E "s/^#define $2[[:space:]]+//")"
            echo "  $1: $2 = ${got:-<absent>}"
            case "$got" in
              *"$3"*) ;;
              *) echo "    EXPECTED it to be derived from $3"; fail=1 ;;
            esac
          }
          want "$M" ST_LOOP_PIN_ENTRY_SECTORS ST_LAT_RESIDENCY_SECTORS
          want "$M" ST_LOOP_PIN_EXIT_SECTORS  ST_LAT_RESIDENCY_SECTORS
          want "$T" ST_LOOP_PIN_TEST_ENTRY_SECTORS ST_LAT_RESIDENCY_SECTORS
          want "$T" ST_LOOP_PIN_TEST_EXIT_SECTORS  ST_LAT_RESIDENCY_SECTORS
          want "$B" ST_STEM_MBOX_SLOTS ST_LAT_RING_SLOTS
          # And the gate must model the shipped ring, not a number of its own.
          if ! grep -q '^#define SLOTS      ST_STEM_MBOX_SLOTS' "$T"; then
            echo "  the playback gate does not model ST_STEM_MBOX_SLOTS"
            fail=1
          fi
          # A literal depth anywhere in the pin geometry is the failure mode
          # this gate exists to catch.
          if grep -qE '^#define ST_LOOP_PIN_(ENTRY|EXIT)_SECTORS[[:space:]]+[0-9]' "$M"; then
            echo "  main.c has a LITERAL pin depth -- it must be derived"
            fail=1
          fi
          [ "$fail" = 0 ] || exit 1
          echo "pin/ring geometry: every depth derives from src/st_latency.h"
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_loop.c \
            firmware/stemtape_player/src/st_stem_stream.c \
            firmware/stemtape_player/src/st_beat_phase.c \
            firmware/stemtape_player/tests/test_loop_playback_gate.c \
            -o audit/test_loop_playback_gate
          ./audit/test_loop_playback_gate | tee audit/loop-playback-gate.txt
          {
            echo '### Stem Tape LOOP playback gate'
            echo '```text'
            cat audit/loop-playback-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape FX -- control overlay grammar and DSP vs the committed reference
        # TWO gates in one step. The overlay one drives the REAL st_fx_ctl.c
        # through every case the FX contract names, including the ones that
        # decide whether it can corrupt normal mode: a withheld volume press
        # must still reach master volume, and a Track button the overlay owns
        # must never also reach the solo handler.
        #
        # The DSP one recomputes every expected value in double precision from
        # src/audio/fx/banks.ts's own expressions, inside the test, so the
        # reference is never the thing under test.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_fx_ctl.c \
            firmware/stemtape_player/tests/test_fx_ctl.c \
            -o audit/test_fx_ctl
          ./audit/test_fx_ctl | tee audit/fx-ctl.txt
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_fx.c \
            firmware/stemtape_player/src/st_fx_ctl.c \
            firmware/stemtape_player/tests/test_fx_dsp.c -lm \
            -o audit/test_fx_dsp
          ./audit/test_fx_dsp | tee audit/fx-dsp.txt
          # ---- FX PRODUCTION WIRING ------------------------------------
          # The two tests above are standalone. test_fx_dsp.c says so in its
          # own closing line: "host arithmetic only. Not production-linked
          # and not heard." Neither touches main.c, so a rack whose call
          # sites had been deleted would still have passed both -- correct
          # arithmetic that no audio ever flows through.
          #
          # This gate renders REAL decoded four-stem fixture audio through
          # the SAME insertion arithmetic main.c performs at both scopes and
          # asserts the rack changes the samples, that each effect moves the
          # signal the way its name claims, and -- the case that protects
          # ordinary playback -- that an empty mask is bit-exact passthrough.
          # It measures those properties itself; no expected sample comes
          # from the function under test.
          #
          # Mutation-checked before it landed: removing both insertion
          # points, removing only the STEM one, and cutting the mask off
          # from st_fx_prepare() each fail it.
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_fx.c \
            firmware/stemtape_player/src/st_fx_ctl.c \
            firmware/stemtape_player/src/st_sector_v11.c \
            firmware/stemtape_player/src/st_stem_mix.c \
            firmware/stemtape_player/tests/test_fx_wiring_gate.c -lm \
            -o audit/test_fx_wiring_gate
          ./audit/test_fx_wiring_gate | tee audit/fx-wiring.txt
          grep -q 'FX WIRING GATE PASSED' audit/fx-wiring.txt
          # THE GATE COPIES main.c's INSERTION ARITHMETIC, because a host
          # file cannot call main.c's static render function. That copy is
          # only worth anything while the original still exists and still
          # looks like it, so assert the real call sites directly. Counted,
          # not merely present: exactly two st_fx_process() sites (one per
          # scope) and one st_fx_prepare(). A third would mean the rack is
          # being applied somewhere this gate does not model.
          M=firmware/stemtape_player/src/main.c
          NPROC="$(grep -c 'st_fx_process(&g_stem_fx' "$M" || true)"
          NPREP="$(grep -c 'st_fx_prepare(&g_stem_fx' "$M" || true)"
          echo "main.c FX insertion sites: st_fx_process=${NPROC} st_fx_prepare=${NPREP}"
          if [ "$NPROC" -ne 2 ]; then
            echo "FAIL: expected exactly 2 st_fx_process() call sites in main.c, found ${NPROC}"
            grep -n 'st_fx_process' "$M" || true
            exit 1
          fi
          if [ "$NPREP" -ne 1 ]; then
            echo "FAIL: expected exactly 1 st_fx_prepare() call site in main.c, found ${NPREP}"
            grep -n 'st_fx_prepare' "$M" || true
            exit 1
          fi
          # And that the mask the overlay publishes is what prepare receives
          # -- the link mutation B in the wiring gate simulates breaking.
          if ! grep -q 's_fx_active_mask' "$M"; then
            echo "FAIL: main.c never publishes s_fx_active_mask to the rack"
            exit 1
          fi
          echo "FX production wiring: 2 process sites, 1 prepare site, mask published"
          {
            echo '### Stem Tape FX production wiring'
            echo '```text'
            cat audit/fx-wiring.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The FX LED overlay must not have disturbed anything below it.
          grep -q 'LED ACCEPTANCE MATRIX PASSED' audit/led-acceptance-matrix.txt \
            || echo "(LED matrix runs in its own step)" 
          # The one-rack budget is an artefact, not a claim in prose.
          python3 .github/scripts/stemtape_fx_budget.py | tee audit/fx-budget.txt
          # THE CALIBRATION CAPTURE MUST NOT SHIP, exactly as for AIN0.
          if grep -qE '^#define ST_VOL_CAL 1' firmware/stemtape_player/src/main.c; then
            echo "ST_VOL_CAL is enabled in a shipped image"; exit 1
          fi
          echo "AIN1 calibration capture is disabled in this image"
          {
            echo '### Stem Tape FX'
            echo '```text'
            tail -n 3 audit/fx-ctl.txt
            tail -n 3 audit/fx-dsp.txt
            sed -n '/ONE-RACK RAM/,/TOTAL FX RAM/p' audit/fx-budget.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape LOOP SEAM gate -- waveform discontinuity in real decoded audio
        # WHY THIS EXISTS SEPARATELY FROM THE PLAYBACK GATE ABOVE.
        #
        # The playback gate reported "zero silent frames" at entry, wrap and
        # exit for st17, and st17 audibly blipped at all three on the physical
        # SP-1. It was not wrong about what it measured; it measured the wrong
        # quantity. It asserted that frame INDICES were contiguous and that no
        # silence was emitted. Both were true. It never read a sample VALUE.
        #
        # A loop seam joins two unrelated points in a waveform: the frame
        # before the jump and the frame after it are adjacent in the output and
        # arbitrarily far apart in amplitude. That step edge is the click, and
        # it exists with every frame present and every sector resident. No
        # buffer depth can remove it, which is exactly why chasing it with
        # depth is forbidden.
        #
        # So this gate decodes the frozen four-stem fixture and measures the
        # step, against the material's OWN largest natural step around each
        # window. The expected samples come from the fixture through
        # st11_sector_decode_frame() plus a local unity mix -- never by calling
        # the production mixer and comparing it to itself.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          # ---- THE PRODUCTION WIRING, proved before the model is run -------
          # A gate that only exercises a host model of the seam would pass
          # just as happily with the seam unwired -- which is the shape of
          # mistake that shipped st17. So first prove main.c actually routes
          # its loop transitions through it.
          M=firmware/stemtape_player/src/main.c
          fail=0
          grep -q '^#include "st_seam.h"' "$M" || {
            echo "  main.c does not include st_seam.h"; fail=1; }
          grep -q 'st_seam_jump_due(&s_stem_seam)' "$M" || {
            echo "  main.c never jumps on st_seam_jump_due()"; fail=1; }
          grep -q 'st_seam_t \*seam' "$M" || {
            echo "  stem_render_run() does not take the seam"; fail=1; }
          grep -q 'st_seam_gain(seam)' "$M" || {
            echo "  the render loop never applies the seam gain"; fail=1; }
          # EXACTLY TWO seeks may exist in the audio path: the ducked wrap,
          # and its containment backstop. A third is an un-ducked transition,
          # i.e. the defect coming back.
          seeks="$(grep -cE '^[[:space:]]*(bool moved = |if \()st_stream_seek\(' "$M")"
          echo "  st_stream_seek() call sites in the audio path: $seeks (want 2)"
          [ "$seeks" = 2 ] || { echo "  an un-ducked loop seek has appeared"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "seam wiring: the wrap ducks before it jumps"
          # st_seam.h is header-only inline; there is no st_seam.c.
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_loop.c \
            firmware/stemtape_player/src/st_sector_v11.c \
            firmware/stemtape_player/src/st_checksum32.c \
            firmware/stemtape_player/src/st_crc32.c \
            firmware/stemtape_player/tests/test_loop_seam_gate.c \
            -o audit/test_loop_seam_gate
          ./audit/test_loop_seam_gate | tee audit/loop-seam-gate.txt
          # The gate must keep reproducing st17's defect, not just pass. If the
          # "ducker disengaged" case ever stops showing a real step at the
          # WRAP, the harness has stopped modelling the thing that failed on
          # hardware.
          #
          # It used to say "all three transitions"; there is only one seam
          # now. Engage and release no longer move the playhead, so they have
          # no step to duck -- the gate asserts they measure ZERO, and the
          # LOOP TRANSPORT gate owns that claim properly.
          grep -q 'the WRAP produces a real step' \
            audit/loop-seam-gate.txt
          grep -q 'engage and release move nothing' \
            audit/loop-seam-gate.txt
          {
            echo '### Stem Tape LOOP SEAM gate (waveform discontinuity)'
            echo 'Host measurement of sample VALUES. NOT audible verification.'
            echo '```text'
            cat audit/loop-seam-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape LOOP TRANSPORT gate -- engage/release never move the playhead
        # THE SP-1 LOOP CONTRACT, as a machine check. Engaging or releasing the
        # loop changes the transport's RULES, never its POSITION; only the
        # playhead crossing loopEnd may move it.
        #
        # WHAT THIS CAUGHT. The shipped loop seeked BACK to the captured frame
        # on engage. loop_start is captured at PLAY-DOWN, so by the time the
        # hold threshold made it a loop the playhead was a whole hold past it,
        # and the seek replayed everything in between -- on a vocal reading
        # "for me no", engaging during "me" gave "for me - me no", with the
        # syllable audibly restarting. Release did the mirror, seeking forward
        # to loop_end. Reported from hardware; both seeks are now gone.
        #
        # The assertions are on the EMITTED FRAME SEQUENCE, not on any internal
        # flag, so an engine that merely believes it behaved cannot pass. The
        # engage is swept over all 256 block offsets and the release over a
        # whole lap, because both land wherever the player's finger lands --
        # including inside the wrap's duck window, which is the case that used
        # to fire a jump on release.
        #
        # It also covers the failure the missing entry seek could have
        # introduced: with no seek the playhead can start OUTSIDE the window,
        # and a loop shorter than the hold would otherwise never wrap at all --
        # silence where a loop should be, which is worse than a click.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_sector_v11.c \
            firmware/stemtape_player/tests/test_loop_transport_gate.c \
            -o audit/test_loop_transport_gate
          ./audit/test_loop_transport_gate | tee audit/loop-transport.txt
          grep -q 'LOOP TRANSPORT GATE PASSED' audit/loop-transport.txt
          # PRODUCTION WIRING. The host gate models stem_audio_block()'s loop
          # handling; that model is only worth something while production
          # really has no entry or exit seek. Assert the seek kinds are gone
          # from main.c entirely -- ST_SEAM_JUMP_WRAP must be the only one.
          M=firmware/stemtape_player/src/main.c
          for dead in ST_SEAM_JUMP_ENTER ST_SEAM_JUMP_EXIT g_stem_loop_resume_fr g_stem_loop_enter_fr; do
            if grep -q "$dead" "$M"; then
              echo "FAIL: $dead is back in main.c -- an entry or exit seek has returned"
              grep -n "$dead" "$M"
              exit 1
            fi
          done
          NSEEK="$(grep -c 'st_stream_seek(&g_stem_stream' "$M" || true)"
          echo "st_stream_seek call sites in the audio path: ${NSEEK}"
          if [ "$NSEEK" -ne 2 ]; then
            echo "FAIL: expected exactly 2 (the ducked wrap and its backstop), found ${NSEEK}"
            grep -n 'st_stream_seek' "$M" || true
            exit 1
          fi
          echo "loop transport: no entry seek, no exit seek, wrap is the only move"
          {
            echo '### Stem Tape loop transport'
            echo '```text'
            cat audit/loop-transport.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape ROCKER SEMITONES -- the Tape Looper's own pitch grid, reused
        # THE BRIEF: expose the semitone capability the Tape Looper already
        # has, rather than building a second pitch engine.
        #
        # WHAT WAS REUSED, and how this step proves it rather than asserting
        # it. firmware/src/main.c's k_semi_q16[25] is 2^(k/12) in Q16 -- the
        # Looper's tempo rocker double-click snaps the PLAYBACK SPEED onto it,
        # so pitch and time move together: tape varispeed, no time-stretching.
        # src/st_pitch.c is that same grid at half the step, and the host test
        # transcribes the Looper's table and compares every whole semitone
        # BIT FOR BIT. "Reuse" for a lookup table has to mean the same
        # numbers, not similar ones.
        #
        # THE GESTURE. Single click = half a semitone, double = a whole one,
        # cumulative. The requirement that decides the design is that a double
        # must not ALSO fire the single -- and not merely end up at the right
        # value, since an implementation that fires +0.5 then corrects to +1.0
        # has audibly played the wrong pitch. The single is therefore held for
        # the Looper's own 350 ms window and committed only if no second click
        # arrives; the test watches the value on every control pass through
        # the gesture, not just at the end.
        #
        # THE RANGE IS ASYMMETRIC ON PURPOSE: -12.0 .. +2.5 semitones. Down is
        # free. Up is bounded by eMMC READ THROUGHPUT, re-derived in the test
        # from st_latency.h's own published figures (a sector holds 7083 us of
        # audio, a typical read costs 5073 us, st_latency.h's own 15% margin),
        # so changing the read path without revisiting the pitch range fails
        # here rather than starving the stream on hardware.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_pitch.c \
            firmware/stemtape_player/tests/test_pitch.c \
            -lm -o audit/test_pitch
          ./audit/test_pitch | tee audit/pitch-selftest.txt

          # THE GATE MUST KEEP MEASURING. If the Looper cross-check or the
          # accumulation trace stops being printed, the harness has stopped
          # asking the brief's questions.
          grep -q 'the half-step grid contains' audit/pitch-selftest.txt
          grep -q 'accumulation: +0.5 -> +1.5 -> +1.0 -> +0.0' \
            audit/pitch-selftest.txt
          # The slow toggle's own measurements, for the same reason: a gate
          # that stopped printing the layering trace or the glide duration
          # would still exit 0 while having stopped asking.
          grep -q 'slow playback multiplies the varispeed' audit/pitch-selftest.txt
          grep -q 'exactly one octave down' audit/pitch-selftest.txt
          grep -q 'same glide at 64/256/1024-frame blocks' audit/pitch-selftest.txt

          # AND THE PRODUCTION PATH MUST USE IT.
          M=firmware/stemtape_player/src/main.c
          fail=0
          grep -q '^#include "st_pitch.h"' "$M" || {
            echo "  main.c does not include st_pitch.h"; fail=1; }
          # THE PITCH IS THE REQUESTED RATE, and inertia multiplies OVER it.
          # A build that replaced one with the other would still compile and
          # would silently drop either the pitch or the tape spin-up.
          #
          # The rate is now a THREE-FACTOR product -- semitones x slow x
          # inertia -- and the first two are combined by st_pitch_effective_q16
          # so that the layering itself is host-testable rather than being an
          # inline multiply no test can reach. Requiring the call by name is
          # what stops it being flattened back into main.c.
          grep -q 'st_pitch_effective_q16(&s_stem_pitch, s_stem_slow_q16)' "$M" || {
            echo "  the pitch never reaches the transport rate"; fail=1; }
          grep -q 'st_inertia_env_q16(&s_stem_inertia)) >> 16' "$M" || {
            echo "  inertia no longer multiplies the requested rate"; fail=1; }
          grep -q 'st_pitch_click(&s_stem_pitch' "$M" || {
            echo "  the rocker never reaches the pitch state"; fail=1; }
          grep -q 'st_pitch_tick(&s_stem_pitch' "$M" || {
            echo "  the pending single is never committed"; fail=1; }
          # ONE OWNER OF THE ROCKER. In stem mode the classic tempo path must
          # not also run: nothing reads g_play_speed_q16 there, so letting it
          # write would be a second owner doing dead work.
          grep -q 'pitch_owns_rocker' "$M" || {
            echo "  the classic tempo path is not fenced off in stem mode"
            fail=1; }

          # ---- FX + PLAY SLOW PLAYBACK ---------------------------------
          # A SECOND FACTOR, NOT A SECOND ENGINE. The brief: "reuse Stem
          # Tape's existing varispeed implementation. Do NOT build a separate
          # slow-playback engine." These greps are what makes that structural:
          # the only thing the control thread may publish is a request flag,
          # and the only thing that consumes it is the same rate product the
          # rocker already feeds.
          grep -q 'atomic_set(&g_stem_slow_req' "$M" || {
            echo "  FX+PLAY never publishes a slow request"; fail=1; }
          grep -q 'st_pitch_slow_glide(s_stem_slow_q16' "$M" || {
            echo "  the slow request never becomes a glided multiplier"
            fail=1; }
          # THE GLIDE IS ON THE AUDIO CLOCK, advanced in frames beside the
          # inertia envelope. A control-thread or timer-driven glide would
          # drift against the audio it is bending.
          grep -q 'BLK_FRAMES, I2S_TRUE_HZ' "$M" || {
            echo "  the slow glide is not advanced on the audio clock"
            fail=1; }
          # ONE GESTURE, ONE MEANING. With the overlay open and the transport
          # running, a PLAY TAP must toggle slow INSTEAD OF the transport --
          # the brief: "pressing PLAY as part of this combination does NOT
          # also trigger the normal PLAY action". An if/else is what makes
          # that exclusive; two independent ifs would do both.
          grep -q 'if (g_stem_fx_out.fx_open && g_playing) {' "$M" || {
            echo "  FX+PLAY does not exclusively claim the PLAY tap"; fail=1; }
          # AND SLOW IS PER-SONG. Loading a different song must not leave the
          # previous song's slow state engaged.
          grep -q 's_stem_slow_q16 = ST_PITCH_ONE;' "$M" || {
            echo "  the slow multiplier is never reset on song change"
            fail=1; }
          # NO SEPARATE ENGINE. The ONLY thing slow does is scale the rate
          # that already exists, so no second stretcher/resampler/clock may
          # appear. Matched as IDENTIFIERS, not as prose: this file's comments
          # discuss time-stretching at length precisely to say it is not done
          # here, and a bare word match would fire on the documentation of the
          # very property it is checking.
          if grep -nE '\b(time_stretch|slow_engine|slow_resample|slow_rate_q16)\b' \
               "$M"; then
            echo "  a separate slow-playback path appeared in main.c"; fail=1
          fi

          [ "$fail" = 0 ] || exit 1
          echo "pitch wiring: rocker -> semitones -> one transport -> four stems"
          echo "slow wiring: FX+PLAY -> request -> glide -> the SAME rate product"
          {
            echo '### Stem Tape rocker semitone control'
            echo '```text'
            cat audit/pitch-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape TRANSPORT INERTIA -- the reel has mass, and it is a pitch drop
        # THE BRIEF, and the line it drew:
        #
        #   "If I hear normal-pitched audio simply fading in or out, the
        #    implementation is wrong."
        #
        # That rules out the two easy wrong answers. A gain fade is wrong
        # because pitch does not move. A time-stretch is wrong because pitch
        # does not move. The only implementation that satisfies it is the
        # physical one: advance the read position at the instantaneous
        # transport rate, so the tape passes the head slowly and the pitch
        # falls with it because pitch and time are the same quantity.
        #
        # TWO GATES, because there are two claims.
        #
        # test_inertia.c proves the ENVELOPE -- the shape and duration of the
        # ramp. Spin-up eases in, drives through the middle and settles;
        # spin-down loses speed at once then crawls; both stay inside the
        # briefed 250-500 ms and 400-800 ms windows; a PLAY during a
        # spin-down catches the reel rather than restarting it; and the ramp
        # is identical however the audio thread happens to chop its runs.
        #
        # test_inertia_transport_gate.c proves the AUDIO, and it is the one
        # that answers the brief. It renders a 1 kHz tone through a real
        # spin-down and measures the OUTPUT's own period and level: the
        # period must stretch by more than an octave, and the level must NOT
        # collapse. A fade fails the first. A time-stretch fails it too. It
        # also runs the production run-loop arithmetic across eleven rates
        # and five starting phases to prove the source/output domain split
        # never reads past a sector, and checks the rendered waveform against
        # sin() at the fractional position the cursor claims -- which is what
        # separates a real blend from a nearest-frame staircase.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_inertia.c \
            firmware/stemtape_player/tests/test_inertia.c \
            -lm -o audit/test_inertia
          ./audit/test_inertia | tee audit/inertia-selftest.txt
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_sector_v11.c \
            firmware/stemtape_player/src/st_inertia.c \
            firmware/stemtape_player/src/st_pitch.c \
            firmware/stemtape_player/tests/test_inertia_transport_gate.c \
            -lm -o audit/test_inertia_transport_gate
          ./audit/test_inertia_transport_gate | tee audit/inertia-transport-gate.txt

          # THE GATE MUST KEEP MEASURING THE THING, not just exit 0. If the
          # pitch line or the level line ever stops being printed, the
          # harness has stopped asking the question the brief asked, and a
          # silent pass would be worth nothing.
          grep -q 'level held at' audit/inertia-transport-gate.txt
          grep -q 'STOP drops the pitch and keeps the level' \
            audit/inertia-transport-gate.txt
          # The slow toggle measured through the SAME rig: the period must
          # double, which is the audible difference between tape slow and a
          # time stretch. A gate that stopped printing it stopped asking.
          grep -q 'FX+PLAY slow halves the rendered pitch' \
            audit/inertia-transport-gate.txt

          # AND THE PRODUCTION PATH MUST ACTUALLY USE IT. The modules above
          # are pure and would pass just as happily unwired -- which is the
          # shape of mistake the seam step below also guards against.
          M=firmware/stemtape_player/src/main.c
          fail=0
          grep -q '^#include "st_inertia.h"' "$M" || {
            echo "  main.c does not include st_inertia.h"; fail=1; }
          grep -q 'st_inertia_play(&s_stem_inertia' "$M" || {
            echo "  PLAY never spins the reel up"; fail=1; }
          grep -q 'st_inertia_stop(&s_stem_inertia' "$M" || {
            echo "  STOP never spins the reel down"; fail=1; }
          grep -q 'st_inertia_advance(&s_stem_inertia, BLK_FRAMES)' "$M" || {
            echo "  the envelope is not advanced on the audio clock"; fail=1; }
          # THE ONE THAT MAKES STOP NOT A MUTE: the stem engine must keep
          # rendering while the reel is still turning, after g_playing has
          # already gone false.
          grep -q 'g_playing || st_inertia_moving(&s_stem_inertia)' "$M" || {
            echo "  the engine stops rendering the moment PLAY is released --"
            echo "  the spin-down would be silence, i.e. a mute"; fail=1; }
          # AND THE RATE MUST REACH THE READ. An envelope that never becomes
          # a read position is a fade waiting to happen.
          grep -q 'rate_q16, &s_stem_rate_frac' "$M" || {
            echo "  the renderer is not given the transport rate"; fail=1; }
          grep -q 'st_rs_out_frames(run, s_stem_rate_frac, rate_q16)' "$M" || {
            echo "  the source/output domain conversion is not applied"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "inertia wiring: PLAY/STOP move the reel, and the reel moves the tape"
          {
            echo '### Stem Tape transport inertia'
            echo '```text'
            cat audit/inertia-selftest.txt
            cat audit/inertia-transport-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape ladder classifier -- MEASURED bands, all 15 masks, no deadlock
        # src/st_ladder.c is THE classifier for the shared AIN0 rail: one
        # sample in, a settled Track mask or PLAY out. Linked into the real
        # firmware target (CMakeLists.txt) and genuinely called -- st_ctl.c
        # feeds it main.c's single per-pass ladder_read(), and the mask it
        # settles on becomes trk[k].solo and the LED solo mask, proven by the
        # "stored four-stem playback wiring check" step below.
        #
        # PROVENANCE IS A MEASUREMENT, NOT A MODEL. Every band comes from
        # firmware/stemtape_player/docs/ladder-measured.json -- a capture
        # taken on a physical SP-1 with the temporary st16-cal build. The test
        # does not transcribe the band table; it RE-DERIVES it from those
        # measured centres by the documented rule and fails if a row in the
        # firmware has been hand-edited away from the hardware.
        #
        # WHAT THE MEASUREMENT OVERTURNED. st15 claimed every chord holding
        # both Track 3 and Track 4 collided with PLAY, from a model anchored
        # on the midpoint of the WIDE 1280..1390 DFU tolerance band instead of
        # the true T1+T4 centre of 1309. The real ladder resolves ALL FIFTEEN
        # masks: T3+T4 1559, T1+T3+T4 1628, T2+T3+T4 1695, all four 1755,
        # PLAY 1813. Tightest clearance on the whole rail is 58 counts against
        # 6 counts of observed jitter.
        #
        # AND WHY CHORDS DID NOTHING ON HARDWARE. st15's decoder had a slew
        # guard -- "if |raw - last_raw| > 40, return the settled mask" -- that
        # made no progress. main.c's own ladder_read() comment records that
        # audio and USB activity couple into the shared BTN_COM rail while a
        # song streams, so any sustained coupling past that threshold latched
        # the mask at zero for as long as the song played. It also bought
        # nothing: a switched resistor ladder steps in microseconds, so there
        # was never a sweep to reject. The gate below asserts, on measured
        # values, that a large step now COMMITS instead of stalling.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_ladder.c \
            firmware/stemtape_player/tests/test_ladder.c \
            -o audit/test_ladder
          ./audit/test_ladder | tee audit/ladder-selftest.txt
          {
            echo '### Stem Tape ladder classifier (measured bands)'
            echo '```text'
            cat audit/ladder-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape AIN1 volume ladder -- MEASURED bands, the FX entry chord
        # The companion rail to the AIN0 step above, and the one that was
        # never calibrated. AIN1 carries Volume-, Volume+, FWD and RWD.
        #
        # PROVENANCE IS A MEASUREMENT, NOT A MODEL. Every asserted band comes
        # from firmware/stemtape_player/docs/ain1-measured.json -- a capture
        # taken on a physical SP-1 with the temporary st20-VOLCAL build:
        #
        #     nothing pressed      1 ..   10
        #     Volume-            732 ..  742
        #     Volume+           1821 .. 1830
        #     BOTH together     2019 .. 2029
        #
        # WHAT THE MEASUREMENT OVERTURNED, and why this gate exists. The top
        # band used to be "anything >= 1500", so Volume+ and the two-button
        # chord BOTH decoded as VOL_UP and were indistinguishable. FX mode is
        # entered by pressing Volume- and Volume+ together, so that one
        # ambiguity was the entire blocker on FX entry -- it could not be
        # decoded at all, on any build, until this capture existed.
        #
        # The split now sits at the midpoint of the measured 1830..2019 gap,
        # 95 counts clear of both neighbours against 11 counts of observed
        # jitter on the widest plateau.
        #
        # st_vol_decode() lives in a HEADER (src/st_vol_ladder.h) rather than
        # as a static inside main.c specifically so this test can call the
        # SAME function the control loop calls. A hand-edited threshold fails
        # here instead of silently breaking the gesture on hardware. The test
        # was mutation-checked before it landed: reverting the split to 1500,
        # moving it 10 counts, or letting st_vol_is_chord() drift out of step
        # with the decode each produce failures.
        #
        # WHAT IT DELIBERATELY DOES NOT ASSERT: FWD and RWD were never pressed
        # during the capture, so their bands remain inherited guesses. The
        # test checks only that they do not swallow anything that WAS
        # measured. Claiming their centres are correct would be inventing
        # evidence.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/tests/test_vol_ladder.c \
            -o audit/test_vol_ladder
          ./audit/test_vol_ladder | tee audit/vol-ladder-selftest.txt
          # The firmware and the measurement file must not drift apart. The C
          # test asserts the decode against transcribed numbers; this asserts
          # the transcription still matches the JSON that is their provenance.
          python3 - <<'PY'
          import json, re, sys
          j = json.load(open('firmware/stemtape_player/docs/ain1-measured.json'))
          hdr = open('firmware/stemtape_player/src/st_vol_ladder.h').read()
          tst = open('firmware/stemtape_player/tests/test_vol_ladder.c').read()
          bad = []
          for k in ('ST_VOL_CHORD_MIN', 'ST_VOL_CHORD_RAW'):
              want = j['band_edges'][k]
              m = re.search(r'#define\s+%s\s+(\d+)' % k, hdr)
              if not m:
                  bad.append('%s not found in st_vol_ladder.h' % k); continue
              if int(m.group(1)) != want:
                  bad.append('%s: header %s, ain1-measured.json %d'
                             % (k, m.group(1), want))
          for st in j['states']:
              row = '{ %4d, %4d,' % (st['lo'], st['hi'])
              if row.replace(' ', '') not in tst.replace(' ', ''):
                  bad.append('state %s (%d..%d) is not a row in test_vol_ladder.c'
                             % (st['name'], st['lo'], st['hi']))
          if bad:
              print('FAIL: firmware and ain1-measured.json disagree')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('OK: header constants and test rows match ain1-measured.json')
          PY
          {
            echo '### Stem Tape AIN1 volume ladder (measured bands)'
            echo '```text'
            cat audit/vol-ladder-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape ASSEMBLED control path -- the real dispatcher, measured ADC inputs
        # This is the one that matters. It drives st_ctl_service() -- the same
        # function, in the same arbitration order, that main.c's control loop
        # calls once per pass -- with timed sequences of REAL MEASURED ADC
        # values, and asserts on what the dispatcher publishes to the mixer,
        # the LEDs and the audio thread. Not a state machine in isolation.
        #
        # It covers, on physical measurements rather than model centres:
        #   * PLAY-DOWN captures the loop start; the threshold enters THERE,
        #     not at the frame the hold expired on
        #   * a short tap is still play/stop and starts no loop
        #   * cold boot is exactly one bar of the measured 93.71 BPM tempo
        #   * PLAY + Volume still changes the division (confirmed working on
        #     hardware -- it must not regress), and the choice persists for
        #     later loops in the same session but not across a reset
        #   * FUNCTION latches exactly once and is CONSUMED, so main.c's own
        #     FUNCTION branch cannot also act on that press
        #   * releasing PLAY after latching does not exit; a new PLAY press
        #     does, without stopping the transport, and its release is spent
        #   * every exit -- unlatched, latched, forward or reversed -- resumes
        #     at loop_end, and nothing inside [start, end) is heard again
        #   * all 15 measured masks decode; a >40-count step commits; a
        #     transient ADC error does not erase a held chord; one idle
        #     sample is not a release
        #   * a song with no tempo REFUSES out loud instead of silently doing
        #     nothing or faking a loop
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_ctl.c \
            firmware/stemtape_player/src/st_ladder.c \
            firmware/stemtape_player/src/st_loop.c \
            firmware/stemtape_player/tests/test_ctl.c \
            -o audit/test_ctl
          ./audit/test_ctl | tee audit/ctl-selftest.txt
          {
            echo '### Stem Tape assembled control path'
            echo '```text'
            cat audit/ctl-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape LED acceptance matrix -- boot, battery gauge, beat/chase, solo, shutdown
        # Drives the REAL production LED decision -- src/st_led_mvp.c's
        # st_led_mvp_decide() -- AND the REAL src/st_beat_phase.c's
        # st_beat_pulse(), the same object files linked into the firmware and
        # the same functions main.c's led_service() calls. Covers the boot
        # sequence and its fade, every battery gauge level, all four beats of
        # the bar chase, the between-beats darkness, activity scaling, an
        # absent tempo, immediate solo hold and release, the charging gauge,
        # transfer, the shutdown sequence, and the full priority order.
        #
        # THE PERSISTENT STOPPED-STATE GAUGE is the rule this matrix now
        # requires, and an earlier revision required its opposite. Whenever
        # the SP-1 is powered on and NOT playing, the side row shows the
        # current trustworthy battery level continuously -- stopped with a
        # song loaded, with no song selected, on battery, on USB, charging,
        # full, mid-transfer, and with a Track button held. The matrix asserts
        # each of those rows against the production decision. Playing is the
        # one state that takes the side row over (S1-S3 dark, S4 carries the
        # beat envelope), and the ONLY thing that darkens the row while
        # stopped is a reading the gauge itself refuses to trust
        # (unavailable, faulted, or never seeded), which is left dark rather
        # than rendered as a fabricated level. Every assertion that the side
        # row goes dark once the boot preview elapses has been deleted; it
        # proved the wrong product requirement.
        #
        # The beat/chase rows pass only because st_beat_pulse() derives the
        # envelope and bar position from a real STIX-style tempo snapshot and
        # a song_frame -- not because the test asserted a shape. That is what
        # makes this coverage of the shipping behaviour rather than of a
        # reference model: the LED tests this replaced exercised
        # st_led_pattern.c/led_render.c, which CMakeLists.txt does not
        # compile into this firmware at all.
        #
        # TRUTHFUL WORDING: this proves the production DECISION assigns those
        # eight modes. It does NOT prove the physical device lights up that
        # way -- no GPIO, no TIMER3, no human eye. Physical LED verification
        # remains a human check on real hardware.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_led_mvp.c \
            firmware/stemtape_player/src/st_beat_phase.c \
            firmware/stemtape_player/src/st_ladder.c \
            firmware/stemtape_player/tests/test_st_led_mvp.c \
            -o audit/test_st_led_mvp
          ./audit/test_st_led_mvp | tee audit/led-acceptance-matrix.txt
          {
            echo '### Stem Tape MVP LED acceptance matrix'
            echo '```text'
            cat audit/led-acceptance-matrix.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stem Tape v1.1 stored four-stem playback wiring check (fail-closed)
        # Phase 2 slice 3C: proves the real production call sequence for
        # CONTINUOUS streaming, handed off through the real atomic mailbox
        # -- looper_audio_block() (the mailbox consumer) calling
        # st_stream_required_sector()/st_stream_sector_ready()/st_stream_
        # advance_frame()/st_stem_mbox_try_acquire()/st_stem_mbox_set_
        # requested_sector()/st11_sector_decode_frame()/st_stem_mix_
        # frame(), streamer_thread() (the mailbox producer) calling
        # st_stream_init()/st_stream_validate_sector()/st_stem_mbox_
        # init()/st_stem_mbox_producer_next_fill()/st_stem_mbox_
        # publish_ready()/st11_sector_read_header(), AND (new in slice
        # 3C) audio_thread() calling looper_audio_block()/i2s_write() --
        # the final link, proving the mixer's real output reaches the
        # SAME physical I2S write call site the golden classic bus
        # already used -- is genuinely present as real call sites in
        # main.c's own source, not merely that the callee symbols happen
        # to be linked somewhere (the runtime symbol-presence gate
        # already proves that separately). Source-level proof only --
        # see the "full continuous playback gate" step below for the
        # complementary REAL two-thread algorithmic proof, and this
        # step's own final NOTE for what neither proves. See .github/
        # scripts/stemtape_player_stem_playback_wiring_check.py's own
        # doc comment.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/stemtape_player_stem_playback_wiring_check.py \
            firmware/stemtape_player/src/main.c \
            audit/stem-playback-wiring-check.md | tee audit/stem-playback-wiring-check.txt
          {
            echo '### Stem Tape v1.1 stored four-stem playback wiring check'
            echo '```text'
            cat audit/stem-playback-wiring-check.txt
            echo '```'
