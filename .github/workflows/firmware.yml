name: firmware

# Builds the untouched SP-1 Tape Looper firmware exactly as firmware/README.md
# specifies: Zephyr v4.3.1 + Zephyr SDK 0.17.4, the UAC2 Windows FS-feedback
# patch applied to the Zephyr tree, then a single west build.
#
# Workspace layout (all paths are relative to $GITHUB_WORKSPACE):
#   project/           <- west workspace topdir (this repository)
#   project/zephyr/    <- Zephyr v4.3.1 checkout created by action-zephyr-setup
#   project/firmware/  <- Zephyr application + in-repo board + patches
#   project/build/     <- build output
#
# No job-level Docker container: the zephyrproject-rtos/ci image unpacks every
# toolchain (Xtensa included) and exhausts the runner disk. action-zephyr-setup
# installs only the arm-zephyr-eabi toolchain.

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - '.github/scripts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: project

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Zephyr v4.3.1 + SDK 0.17.4 (arm-zephyr-eabi only)
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a  # v1.0.15
        with:
          base-path: project
          app-path: firmware
          toolchains: arm-zephyr-eabi
          sdk-version: 0.17.4

      - name: Path preflight
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          test -d zephyr
          test -f zephyr/VERSION
          test -d firmware
          test -f firmware/CMakeLists.txt
          test -d firmware/boards/teenageengineering/stem_player
          test -f firmware/patches/uac2-windows-fs-feedback.patch
          west topdir

      - name: Apply documented Zephyr patch
        working-directory: ${{ github.workspace }}/project/zephyr
        run: |
          set -eux
          git apply --verbose ../firmware/patches/uac2-windows-fs-feedback.patch

      - name: Build (west build -p always -b stem_player firmware)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          west build -p always -b stem_player firmware \
            -- -DBOARD_ROOT="$GITHUB_WORKSPACE/project/firmware"

      - name: Report artifact hash
        working-directory: ${{ github.workspace }}/project/build/zephyr
        run: |
          set -eux
          cp zephyr.bin sp1_looper.bin
          ls -l sp1_looper.bin
          sha256sum sp1_looper.bin | tee -a "$GITHUB_STEP_SUMMARY"

      # GOLDEN TAPE LOOPER (fail-closed): the physical unit's currently-
      # flashed binary was hashed off real hardware and confirmed byte-for-
      # byte identical to this job's own build output. That pairing (real
      # device <-> this exact CI build) is the hardware-proven baseline the
      # whole Stem Tape effort is derived from -- this step guarantees the
      # `firmware/` build stays pinned to it. It compares the FRESHLY
      # GENERATED build/zephyr/sp1_looper.bin from this run, never a
      # possibly-stale checked-in copy, and fails the job on any mismatch
      # (size or hash). It does not alter any Tape Looper source, board
      # file, patch, configuration, or compiler option.
      - name: Assert golden Tape Looper binary (fail-closed)
        working-directory: ${{ github.workspace }}/project/build/zephyr
        run: |
          set -euo pipefail
          EXPECT_SIZE=96232
          EXPECT_SHA256=5670391bbee6a3ebde2c0a15d35a2731faca8fdb165124efda91de6ba48c3a8d
          ACTUAL_SIZE=$(stat -c '%s' sp1_looper.bin)
          ACTUAL_SHA256=$(sha256sum sp1_looper.bin | awk '{print $1}')
          {
            echo '### Golden Tape Looper binary assertion'
            echo '```text'
            echo "expected size:   $EXPECT_SIZE"
            echo "actual size:     $ACTUAL_SIZE"
            echo "expected sha256: $EXPECT_SHA256"
            echo "actual sha256:   $ACTUAL_SHA256"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ok=1
          if [ "$ACTUAL_SIZE" != "$EXPECT_SIZE" ]; then
            echo "::error::sp1_looper.bin size $ACTUAL_SIZE != golden $EXPECT_SIZE"
            ok=0
          fi
          if [ "$ACTUAL_SHA256" != "$EXPECT_SHA256" ]; then
            echo "::error::sp1_looper.bin sha256 $ACTUAL_SHA256 != golden $EXPECT_SHA256"
            ok=0
          fi
          if [ "$ok" -ne 1 ]; then
            echo '### GOLDEN TAPE LOOPER ASSERTION FAILED -- build no longer matches the hardware-verified baseline' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "golden Tape Looper binary confirmed: size and SHA-256 match the hardware-verified baseline"

      - name: Upload sp1_looper.bin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sp1_looper-bin
          path: project/build/zephyr/sp1_looper.bin
          if-no-files-found: error

  stemtape-m0:
    # Milestone M0: the Stem Tape raw USB-MIDI control surface. Same board,
    # same Zephyr revision and SDK; no Zephyr patch is needed (the UAC2
    # Windows feedback workaround only concerns the audio class, which M0
    # does not build).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: project

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Zephyr v4.3.1 + SDK 0.17.4 (arm-zephyr-eabi only)
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a  # v1.0.15
        with:
          base-path: project
          app-path: firmware
          toolchains: arm-zephyr-eabi
          sdk-version: 0.17.4

      - name: Path preflight
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          test -d zephyr
          test -f firmware/stemtape/CMakeLists.txt
          test -f firmware/stemtape/src/main.c
          test -f firmware/stemtape/app.overlay
          test -f firmware/west.yml
          test -d firmware/boards/teenageengineering/stem_player
          west topdir

      - name: Provenance preflight (clean tree, frozen manifest, toolchain versions)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          # FAIL CLOSED: no untracked-or-modified tracked file may enter a build
          # whose artifact is used for approval decisions.
          git status --porcelain=v1 --untracked-files=no > audit/git-status.txt
          if [ -s audit/git-status.txt ]; then
            echo "tracked Git tree is dirty:" >&2
            cat audit/git-status.txt >&2
            exit 1
          fi
          git rev-parse HEAD                > audit/git-commit.txt
          git log -1 --stat                 > audit/git-log-head.txt
          west manifest --freeze            > audit/west-manifest-freeze.yml
          cp firmware/west.yml                audit/west.yml
          ( cd zephyr && git rev-parse HEAD && cat VERSION ) > audit/zephyr-revision.txt
          west list -f '{name} {path} {revision} {url}' > audit/west-modules.txt
          {
            echo "runner: $RUNNER_OS $RUNNER_ARCH"
            echo "python: $(python3 --version)"
            echo "west:   $(west --version)"
            echo "ZEPHYR_SDK_INSTALL_DIR=${ZEPHYR_SDK_INSTALL_DIR:-unset}"
            echo "sdk-version (workflow input): 0.17.4"
            echo "actions:"
            echo "  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1"
            echo "  actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0"
            echo "  actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1"
            echo "  zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a  # v1.0.15"
          } > audit/provenance.txt
          cat audit/provenance.txt audit/zephyr-revision.txt


      - name: Build (west build -p always -b stem_player firmware/stemtape)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euxo pipefail
          mkdir -p audit
          west build -p always -b stem_player firmware/stemtape -d build-stemtape \
            -- -DBOARD_ROOT="$GITHUB_WORKSPACE/project/firmware" \
               -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee audit/build.log

      - name: Collect toolchain analysis
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          CACHE=build-stemtape/CMakeCache.txt
          test -f "$CACHE"

          cmv() { sed -n "s|^$1:[^=]*=||p" "$CACHE" | tail -n1; }

          OBJDUMP="$(cmv CMAKE_OBJDUMP)"
          SIZE="$(cmv CMAKE_SIZE_UTIL)"
          NM="$(cmv CMAKE_NM)"
          READELF="$(cmv CMAKE_READELF)"
          OBJCOPY="$(cmv CMAKE_OBJCOPY)"

          if [ -z "$OBJDUMP" ]; then
            echo "CMAKE_OBJDUMP missing from $CACHE" >&2
            exit 1
          fi
          BINDIR="$(dirname "$OBJDUMP")"
          BASE="$(basename "$OBJDUMP")"
          PREFIX="${BASE%objdump}"
          [ -n "$SIZE" ]    || SIZE="$BINDIR/${PREFIX}size"
          [ -n "$NM" ]      || NM="$BINDIR/${PREFIX}nm"
          [ -n "$READELF" ] || READELF="$BINDIR/${PREFIX}readelf"
          [ -n "$OBJCOPY" ] || OBJCOPY="$BINDIR/${PREFIX}objcopy"

          for t in "$SIZE" "$OBJDUMP" "$NM" "$READELF" "$OBJCOPY"; do
            if [ ! -x "$t" ]; then
              echo "resolved binutils executable not found or not executable: $t" >&2
              exit 1
            fi
          done

          {
            echo "CMAKE_SIZE_UTIL = $SIZE"
            echo "CMAKE_OBJDUMP   = $OBJDUMP"
            echo "CMAKE_NM        = $NM"
            echo "CMAKE_READELF   = $READELF"
            echo "CMAKE_OBJCOPY   = $OBJCOPY"
            echo "compiler        = $("$(cmv CMAKE_C_COMPILER)" --version | head -n1)"
          } | tee audit/tool-paths.txt
          {
            echo '### M0 resolved binutils paths'
            echo '```text'
            cat audit/tool-paths.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Make the same toolchain directory available to later audit steps.
          echo "$BINDIR" >> "$GITHUB_PATH"

          set -x
          B=build-stemtape/zephyr
          cp "$B/zephyr.bin" "$B/stemtape_m0.bin"
          "$SIZE" -A -x "$B/zephyr.elf"          > audit/size.txt
          "$SIZE" "$B/zephyr.elf"               >> audit/size.txt
          "$OBJDUMP" -h "$B/zephyr.elf"          > audit/objdump-h.txt
          "$OBJDUMP" -d "$B/zephyr.elf"          > audit/objdump-d.txt
          "$NM" -n -S "$B/zephyr.elf"            > audit/nm.txt
          "$READELF" -W -S -l -h "$B/zephyr.elf" > audit/readelf.txt


      - name: Assertion self-test (each assertion must fail when violated)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/m0_assertions_selftest.py | tee audit/assertions-selftest.txt
          {
            echo '### M0 assertion self-test'
            echo '```text'
            grep -E '^\[|^SELF-TEST' audit/assertions-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: LED Feedback Protocol v1 host tests (no Zephyr/nRF toolchain)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Ifirmware/stemtape/src \
            firmware/stemtape/src/led_duty.c \
            firmware/stemtape/src/led_frame.c \
            firmware/stemtape/src/led_midi.c \
            firmware/stemtape/src/led_battery.c \
            firmware/stemtape/src/led_render_policy.c \
            firmware/stemtape/tests/test_led.c \
            -o audit/test_led
          ./audit/test_led | tee audit/led-selftest.txt
          {
            echo '### M0 LED Feedback Protocol v1 host tests'
            echo '```text'
            grep -E '^\[|^LED SELF-TEST' audit/led-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Image assertions (origin, bounds, storage, UICR, entry, vectors, size, BIN identity)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          CACHE=build-stemtape/CMakeCache.txt
          cmv() { sed -n "s|^$1:[^=]*=||p" "$CACHE" | tail -n1; }
          READELF="$(cmv CMAKE_READELF)"; OBJCOPY="$(cmv CMAKE_OBJCOPY)"
          OBJDUMP="$(cmv CMAKE_OBJDUMP)"; BINDIR="$(dirname "$OBJDUMP")"
          PREFIX="$(basename "$OBJDUMP")"; PREFIX="${PREFIX%objdump}"
          [ -n "$READELF" ] || READELF="$BINDIR/${PREFIX}readelf"
          [ -n "$OBJCOPY" ] || OBJCOPY="$BINDIR/${PREFIX}objcopy"
          python3 .github/scripts/m0_image_assertions.py \
            build-stemtape/zephyr/zephyr.elf \
            build-stemtape/zephyr/stemtape_m0.bin \
            --readelf "$READELF" --objcopy "$OBJCOPY" | tee audit/image-assertions.txt
          {
            echo '### M0 image assertions'
            echo '```text'
            grep -E '^\[(PASS|FAIL)\]|^ALL IMAGE' audit/image-assertions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persistent-memory and power audit report (descriptive)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/m0_persistence_audit.py \
            audit/nm.txt audit/persistence-audit.md > /dev/null
          echo "report written: audit/persistence-audit.md"

      - name: STRICT persistence safety gate (fail-closed)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/m0_safety_gate.py \
            audit/nm.txt audit/objdump-d.txt build-stemtape/zephyr/.config \
            audit/safety-gate.md 2>&1 | tee audit/safety-gate.txt
          gate_rc=${PIPESTATUS[0]}
          set -e
          {
            echo '### M0 strict persistence safety gate'
            echo '```text'
            cat audit/safety-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_rc"

      - name: Hashes and sources
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euxo pipefail
          B=build-stemtape/zephyr
          git diff                      > audit/git-diff.txt
          ( cd "$B" && sha256sum stemtape_m0.bin zephyr.bin zephyr.elf zephyr.hex 2>/dev/null || true ) \
            > audit/sha256.txt
          cp "$B/stemtape_m0.bin" "$B/zephyr.elf" "$B/zephyr.map" "$B/zephyr.dts" audit/
          cp "$B/.config" audit/config.txt
          cp build-stemtape/CMakeCache.txt audit/
          cp build-stemtape/compile_commands.json audit/ 2>/dev/null || true
          mkdir -p audit/src/stemtape audit/src/board audit/src/workflow audit/src/docs
          cp -r firmware/stemtape/. audit/src/stemtape/
          cp -r firmware/boards/teenageengineering/stem_player/. audit/src/board/
          cp firmware/west.yml audit/src/
          cp .github/workflows/firmware.yml audit/src/workflow/
          cp .github/scripts/m0_image_assertions.py \
             .github/scripts/m0_assertions_selftest.py \
             .github/scripts/m0_persistence_audit.py \
             .github/scripts/m0_safety_gate.py audit/src/workflow/
          cp docs/stem-tape-led-feedback-v1.md audit/src/docs/ 2>/dev/null || true
          stat -c '%n %s bytes' audit/stemtape_m0.bin | tee -a "$GITHUB_STEP_SUMMARY"
          cat audit/sha256.txt | tee -a "$GITHUB_STEP_SUMMARY"


      - name: Report USB interfaces in the M0 device
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          grep -E '^CONFIG_(USBD_MIDI2_CLASS|USBD_CDC_ACM_CLASS|USBD_AUDIO2_CLASS|USB_DEVICE_STACK_NEXT)=' \
            build-stemtape/zephyr/.config | tee audit/usb-interfaces.txt | tee -a "$GITHUB_STEP_SUMMARY"
          grep -A3 'usb_midi' build-stemtape/zephyr/zephyr.dts >> audit/usb-interfaces.txt || true

      - name: Upload stemtape-m0-audit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: stemtape-m0-audit
          path: project/audit/**
          if-no-files-found: error

  stemtape-player:
    # Stem Tape Player -- GATE 1: USB audio PLAYBACK (not recording) restored
    # via UAC2, plus class-compliant incoming USB-MIDI 2.0 for KO II pad cue
    # control, on top of the safe, read-only four-stem player derived from
    # the golden Tape Looper (firmware/stemtape_player). Same board/Zephyr
    # revision/SDK as the other two targets. The UAC2 Windows-feedback patch
    # the `build` job applies is required again here (CONFIG_USBD_AUDIO2_
    # CLASS=y). Storage still fails closed -- no format-fresh, no metadata/
    # settings persistence, no raw 'W' write, no recording, no route from
    # USB audio or MIDI into eMMC -- see main.c's comments and the strict
    # persistence safety gate below for the exhaustive removal list. Gate 2
    # reintroduces a real, validated 4-stem song transfer write path.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: project

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Zephyr v4.3.1 + SDK 0.17.4 (arm-zephyr-eabi only)
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a  # v1.0.15
        with:
          base-path: project
          app-path: firmware
          toolchains: arm-zephyr-eabi
          sdk-version: 0.17.4

      - name: Path preflight
        working-directory: ${{ github.workspace }}/project
        run: |
          set -eux
          test -d zephyr
          test -f firmware/stemtape_player/CMakeLists.txt
          test -f firmware/stemtape_player/src/main.c
          test -f firmware/stemtape_player/app.overlay
          test -f firmware/patches/uac2-windows-fs-feedback.patch
          test -f firmware/west.yml
          test -d firmware/boards/teenageengineering/stem_player
          west topdir

      - name: Provenance preflight (clean tree, frozen manifest, toolchain versions)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          mkdir -p audit
          git status --porcelain=v1 --untracked-files=no > audit/git-status.txt
          if [ -s audit/git-status.txt ]; then
            echo "tracked Git tree is dirty:" >&2
            cat audit/git-status.txt >&2
            exit 1
          fi
          git rev-parse HEAD                > audit/git-commit.txt
          git log -1 --stat                 > audit/git-log-head.txt
          west manifest --freeze            > audit/west-manifest-freeze.yml
          cp firmware/west.yml                audit/west.yml
          ( cd zephyr && git rev-parse HEAD && cat VERSION ) > audit/zephyr-revision.txt
          west list -f '{name} {path} {revision} {url}' > audit/west-modules.txt

      - name: Apply documented Zephyr patch (UAC2 Windows FS-feedback workaround)
        # GATE 1 restores the UAC2 playback class to this target (see
        # prj.conf: CONFIG_USBD_AUDIO2_CLASS=y), so the same patch the
        # golden `build` job applies to its Zephyr tree is required here too
        # -- main.c's feedback regulator references uac2_fs_fb_windows_fmt,
        # exactly like the classic looper.
        working-directory: ${{ github.workspace }}/project/zephyr
        run: |
          set -eux
          git apply --verbose ../firmware/patches/uac2-windows-fs-feedback.patch

      - name: Build (west build -p always -b stem_player firmware/stemtape_player)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euxo pipefail
          mkdir -p audit
          west build -p always -b stem_player firmware/stemtape_player -d build-stemtape-player \
            -- -DBOARD_ROOT="$GITHUB_WORKSPACE/project/firmware" \
               -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee audit/build.log

      - name: RAM budget assertion (fail-closed)
        # PHASE 1 must fit in a real, measured RAM budget: max 229,376 bytes
        # used (256 KiB region minus a required 32 KiB free), leaving real
        # headroom for runtime stack/audio-buffer behavior. Reads west's own
        # "Memory region ... Used Size" report already captured in
        # audit/build.log by the Build step above -- the same authoritative
        # number `west build` itself computed from the real linked ELF, not
        # a re-derived estimate.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          MAX_USED=229376
          RAM_LINE="$(grep -E '^ *RAM:' audit/build.log | tail -n1)"
          if [ -z "$RAM_LINE" ]; then
            echo "could not find a 'RAM:' memory-region line in audit/build.log" >&2
            exit 1
          fi
          USED="$(echo "$RAM_LINE" | grep -oE '[0-9]+' | head -n1)"
          FREE=$((262144 - USED))
          {
            echo '### Stem Tape Player RAM budget'
            echo '```text'
            echo "$RAM_LINE"
            echo "used:   $USED bytes"
            echo "budget: $MAX_USED bytes max"
            echo "free:   $FREE bytes (region 262144 bytes total)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$USED" -gt "$MAX_USED" ]; then
            echo "::error::RAM used ($USED bytes) exceeds the Phase 1 budget ($MAX_USED bytes)"
            exit 1
          fi
          if [ "$FREE" -lt 32768 ]; then
            echo "::error::RAM free ($FREE bytes) is below the required 32 KiB minimum"
            exit 1
          fi
          echo "RAM budget OK: $USED bytes used, $FREE bytes free"

      - name: Collect toolchain analysis
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          CACHE=build-stemtape-player/CMakeCache.txt
          test -f "$CACHE"

          cmv() { sed -n "s|^$1:[^=]*=||p" "$CACHE" | tail -n1; }

          OBJDUMP="$(cmv CMAKE_OBJDUMP)"
          SIZE="$(cmv CMAKE_SIZE_UTIL)"
          NM="$(cmv CMAKE_NM)"
          READELF="$(cmv CMAKE_READELF)"
          OBJCOPY="$(cmv CMAKE_OBJCOPY)"

          if [ -z "$OBJDUMP" ]; then
            echo "CMAKE_OBJDUMP missing from $CACHE" >&2
            exit 1
          fi
          BINDIR="$(dirname "$OBJDUMP")"
          BASE="$(basename "$OBJDUMP")"
          PREFIX="${BASE%objdump}"
          [ -n "$SIZE" ]    || SIZE="$BINDIR/${PREFIX}size"
          [ -n "$NM" ]      || NM="$BINDIR/${PREFIX}nm"
          [ -n "$READELF" ] || READELF="$BINDIR/${PREFIX}readelf"
          [ -n "$OBJCOPY" ] || OBJCOPY="$BINDIR/${PREFIX}objcopy"

          for t in "$SIZE" "$OBJDUMP" "$NM" "$READELF" "$OBJCOPY"; do
            if [ ! -x "$t" ]; then
              echo "resolved binutils executable not found or not executable: $t" >&2
              exit 1
            fi
          done

          {
            echo "CMAKE_SIZE_UTIL = $SIZE"
            echo "CMAKE_OBJDUMP   = $OBJDUMP"
            echo "CMAKE_NM        = $NM"
            echo "CMAKE_READELF   = $READELF"
            echo "CMAKE_OBJCOPY   = $OBJCOPY"
            echo "compiler        = $("$(cmv CMAKE_C_COMPILER)" --version | head -n1)"
          } | tee audit/tool-paths.txt

          echo "$BINDIR" >> "$GITHUB_PATH"

          set -x
          B=build-stemtape-player/zephyr
          cp "$B/zephyr.bin" "$B/stemtape_player.bin"
          "$SIZE" -A -x "$B/zephyr.elf"          > audit/size.txt
          "$SIZE" "$B/zephyr.elf"               >> audit/size.txt
          "$OBJDUMP" -h "$B/zephyr.elf"          > audit/objdump-h.txt
          "$OBJDUMP" -d "$B/zephyr.elf"          > audit/objdump-d.txt
          "$NM" -n -S "$B/zephyr.elf"            > audit/nm.txt
          "$READELF" -W -S -l -h "$B/zephyr.elf" > audit/readelf.txt

      - name: Stem Tape Player host tests (no Zephyr/nRF toolchain)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Ifirmware/stemtape_player/src \
            firmware/stemtape_player/src/st_crc32.c \
            firmware/stemtape_player/src/st_storage_layout.c \
            firmware/stemtape_player/src/st_sector_codec.c \
            firmware/stemtape_player/src/st_stem_validate.c \
            firmware/stemtape_player/src/st_transfer.c \
            firmware/stemtape_player/src/st_gesture.c \
            firmware/stemtape_player/src/st_scrub.c \
            firmware/stemtape_player/src/st_led_pattern.c \
            firmware/stemtape_player/src/st_midi_queue.c \
            firmware/stemtape_player/tests/test_stemtape_player.c \
            -lm -o audit/test_stemtape_player
          ./audit/test_stemtape_player | tail -c 4000 | tee audit/stemtape-player-selftest.txt
          {
            echo '### Stem Tape Player host tests'
            echo '```text'
            tail -n 20 audit/stemtape-player-selftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Image assertions (origin, bounds, storage, UICR, entry, vectors, size, BIN identity)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          CACHE=build-stemtape-player/CMakeCache.txt
          cmv() { sed -n "s|^$1:[^=]*=||p" "$CACHE" | tail -n1; }
          READELF="$(cmv CMAKE_READELF)"; OBJCOPY="$(cmv CMAKE_OBJCOPY)"
          OBJDUMP="$(cmv CMAKE_OBJDUMP)"; BINDIR="$(dirname "$OBJDUMP")"
          PREFIX="$(basename "$OBJDUMP")"; PREFIX="${PREFIX%objdump}"
          [ -n "$READELF" ] || READELF="$BINDIR/${PREFIX}readelf"
          [ -n "$OBJCOPY" ] || OBJCOPY="$BINDIR/${PREFIX}objcopy"
          python3 .github/scripts/m0_image_assertions.py \
            build-stemtape-player/zephyr/zephyr.elf \
            build-stemtape-player/zephyr/stemtape_player.bin \
            --readelf "$READELF" --objcopy "$OBJCOPY" | tee audit/image-assertions.txt
          {
            echo '### Stem Tape Player image assertions'
            echo '```text'
            grep -E '^\[(PASS|FAIL)\]|^ALL IMAGE' audit/image-assertions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: STEM TAPE runtime symbol-presence gate (fail-closed)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          # PHASE 1 (safe read-only player): proves both that the preserved
          # playback/storage-read/control runtime is actually linked into
          # this build's final ELF, AND that recording/UAC2-input/write
          # capability is genuinely ABSENT from it -- not merely "unused at
          # runtime" but not present in the object file at all. Fails closed
          # (missing nm.txt, any missing required symbol, or any forbidden
          # symbol present = CI failure).
          test -s audit/nm.txt
          missing=0
          # nm marks a function's own text symbol lowercase 't' when it has
          # internal (static) linkage and uppercase 'T' when it's external --
          # nearly everything in main.c is `static`, so both cases count as
          # "really linked in" here. trk_blk() and xfer_service() are
          # deliberately NOT checked: both have exactly one, always-taken
          # call site each (trk_blk() a one-line `static inline`;
          # xfer_service() called unconditionally from streamer_thread()'s
          # loop under `#if SP1_XFER_ENABLE`, `#define`d to 1), so -Os
          # legitimately inlines them with no standalone symbol left in nm --
          # confirmed by a real CI run, not anticipated. Reachability is
          # proven instead by their retained callers (streamer_thread, its
          # loop) plus the single unconditional call site in the source.
          check() {
            if ! grep -qE " [tT] ${1}\$" audit/nm.txt; then
              echo "MISSING required linked symbol: $1" >&2
              missing=1
            else
              echo "present: $1"
            fi
          }
          # Same as check(), but for required DATA/BSS objects (a ring
          # buffer, a memory slab, a `const struct device *const` pointer)
          # rather than functions -- nm marks these with a type letter
          # other than t/T (e.g. b/B/d/D/r/R), so check()'s text-only
          # pattern would never match them even when genuinely linked.
          check_any() {
            if ! grep -qE " [a-zA-Z] ${1}\$" audit/nm.txt; then
              echo "MISSING required linked symbol: $1" >&2
              missing=1
            else
              echo "present: $1"
            fi
          }
          # storage read path (write is checked ABSENT below)
          check emmc_read_blocks
          check emmc_cache_flush
          # cold-boot discovery + the shared-transport playback engine
          check streamer_thread
          check audio_thread
          check looper_audio_block
          # physical control scanner (button/fader ladder read) + LED output
          check ladder_read
          check led_service
          check led_pwm_isr
          # MIDI clock output thread
          check midi_thread
          check main
          # GATE 1: USB audio PLAYBACK path (received audio -> normal output,
          # never storage) -- real callbacks/buffer genuinely linked, not
          # just a symbol name: see the USB descriptor assertion step below
          # for interface/endpoint-level proof.
          check_any usb_audio_ring
          check_any uac2_rx_slab
          check_any uac2_dev
          check uac2_terminal_update_cb
          check uac2_data_recv_cb
          # GATE 1: incoming USB-MIDI receive path (KO II cue control)
          check_any midi_dev
          check midi_rx_packet_cb
          check midi_ready_cb
          check midi_service
          check st_midi_decode_ump32
          check st_midi_queue_push

          # REQUIRED-ABSENT: any of these appearing in the final ELF (any nm
          # symbol type -- function OR data/bss) means recording, overdub,
          # a live capture-to-storage path, or a raw persistent-write
          # capability outside the validated commit path leaked back into
          # the link, which this target must never allow. Restoring UAC2
          # playback and USB-MIDI receive (GATE 1) is explicitly NOT
          # recording -- these stay forbidden exactly as in Phase 1.
          absent() {
            if grep -qE "[[:space:]]${1}\$" audit/nm.txt; then
              echo "FORBIDDEN symbol present in final ELF: $1" >&2
              missing=1
            else
              echo "confirmed absent: $1"
            fi
          }
          # eMMC/index write primitives -- meta_write_blocks() is removed
          # from src/main.c entirely (no definition left to link); this
          # gate does not forbid emmc_write_blocks() itself (Gate 2 will
          # legitimately need it for the validated song-commit path) --
          # see the STRICT persistence safety gate step below, which proves
          # every eMMC write call site instead of forbidding the symbol.
          absent meta_write_blocks
          # the live-input record ring (32 KB) and any recording/overdub
          # state -- must never come back, with or without USB audio.
          absent g_rring
          absent g_record_arm
          absent g_overdub

          if [ "$missing" -ne 0 ]; then
            echo "one or more required runtime symbols are missing, or one or more forbidden symbols are present, in the final ELF" >&2
            exit 1
          fi
          echo "all required Stem Tape Phase 1 runtime symbols are linked, and all forbidden (recording/UAC2/write) symbols are confirmed absent, in zephyr.elf"

      - name: Effective configuration assertion (fail-closed)
        # Checks the REAL effective .config the build actually used (not
        # prj.conf, which only requests values -- some are silently
        # overridden by board/SoC defaults or dependency rules).
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          CFG=build-stemtape-player/zephyr/.config
          test -f "$CFG"
          fail=0
          expect_set() {
            if ! grep -qE "^$1=y\$" "$CFG"; then
              echo "::error::$1 is not =y in the effective config (required)"
              fail=1
            else
              echo "confirmed enabled: $1"
            fi
          }
          expect_set   CONFIG_USBD_AUDIO2_CLASS
          expect_set   CONFIG_USBD_MIDI2_CLASS
          expect_set   CONFIG_USBD_CDC_ACM_CLASS
          expect_set   CONFIG_I2S
          expect_set   CONFIG_ADC
          expect_set   CONFIG_I2C
          expect_set   CONFIG_WATCHDOG
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "effective configuration matches the Gate 1 requirements"

      - name: USB descriptor assertion (fail-closed)
        # A symbol name alone is not proof: this proves the actual
        # descriptor material (not just callback glue) and its enabling
        # devicetree topology are compiled into the final image. See
        # .github/scripts/stemtape_player_usb_descriptor_assertions.py's
        # own docstring for exactly what's checked and why.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/stemtape_player_usb_descriptor_assertions.py \
            audit/nm.txt \
            build-stemtape-player/zephyr/zephyr.elf \
            build-stemtape-player/zephyr/zephyr.dts \
            audit/usb-descriptor-assertion.md | tee audit/usb-descriptor-assertion.txt
          {
            echo '### Stem Tape Player USB descriptor assertion'
            echo '```text'
            cat audit/usb-descriptor-assertion.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persistent-memory and power audit report (descriptive)
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          python3 .github/scripts/m0_persistence_audit.py \
            audit/nm.txt audit/persistence-audit.md > /dev/null
          echo "report written: audit/persistence-audit.md"

      - name: STRICT persistence safety gate (fail-closed)
        # stemtape-player is NOT stemtape-m0: this target's entire purpose is
        # to durably persist validated 4-stem songs to eMMC, so m0_safety_
        # gate.py's blanket "no eMMC write capability may be linked" property
        # is the wrong gate here -- it fails on the exact capability this
        # milestone requires (confirmed by a real CI run: emmc_write_blocks
        # legitimately linked). stemtape_player_safety_gate.py is a
        # DIFFERENT, still strictly fail-closed gate, scoped to this target:
        # every other forbidden category (internal-flash, NVMC, UICR/
        # APPROTECT, any OTHER disk/filesystem/NVS subsystem, MCUboot) stays
        # exactly as forbidden as it is for stemtape-m0, and eMMC writes are
        # allowed ONLY when proven -- by real call-site/brace-depth tracing,
        # evidence printed below -- to be either unmodified classic Tape
        # Looper persistence behavior (matched call-for-call against the
        # untouched firmware/src/main.c baseline) or newly reachable only
        # after st_stem_validate_commit(...) has returned ST_STEM_OK.
        # m0_safety_gate.py itself is untouched and still strictly applied,
        # unchanged, to the stemtape-m0 job below.
        working-directory: ${{ github.workspace }}/project
        run: |
          set -euo pipefail
          set +e
          python3 .github/scripts/stemtape_player_safety_gate.py \
            audit/nm.txt audit/objdump-d.txt build-stemtape-player/zephyr/.config \
            firmware/src/main.c \
            audit/safety-gate.md 2>&1 | tee audit/safety-gate.txt
          gate_rc=${PIPESTATUS[0]}
          set -e
          {
            echo '### Stem Tape Player strict persistence safety gate'
            echo '```text'
            cat audit/safety-gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_rc"

      - name: Hashes and sources
        # STEM TAPE: made resilient to a FAILED build (this step already ran
        # if: always(), but previously used bare `cp` under `set -e` for the
        # final artifacts, so a failed link -- no zephyr.elf/.bin/.map --
        # made THIS step also fail before it ever reached the source-tree
        # copy, silently discarding the one thing most useful for debugging
        # a failed build: build.log (already captured by the Build step's
        # own `tee`) and, for a link failure specifically, the linker's own
        # PARTIAL map (zephyr_pre0.map, produced even when the final
        # zephyr_pre0.elf link fails -- see e.g. "region `RAM' overflowed").
        # This does NOT change whether the build step itself passes or
        # fails -- that verdict is untouched -- it only stops throwing away
        # the evidence when it doesn't.
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}/project
        run: |
          set -uxo pipefail
          B=build-stemtape-player/zephyr
          git diff > audit/git-diff.txt
          {
            echo "build_succeeded=$( [ -f "$B/zephyr.elf" ] && echo 1 || echo 0 )"
          } > audit/build-status.txt
          cat audit/build-status.txt
          ( cd "$B" && sha256sum stemtape_player.bin zephyr.bin zephyr.elf zephyr.hex 2>/dev/null || true ) \
            > audit/sha256.txt
          # Best-effort per file: never let one missing artifact (e.g. a
          # failed final link) discard everything else that DID get produced.
          for f in stemtape_player.bin zephyr.elf zephyr.map zephyr.dts zephyr_pre0.map zephyr_pre0.elf; do
            [ -f "$B/$f" ] && cp "$B/$f" audit/ || echo "audit: $f not present (expected on a failed build)"
          done
          [ -f "$B/.config" ] && cp "$B/.config" audit/config.txt
          [ -f build-stemtape-player/CMakeCache.txt ] && cp build-stemtape-player/CMakeCache.txt audit/
          [ -f build-stemtape-player/compile_commands.json ] && cp build-stemtape-player/compile_commands.json audit/
          mkdir -p audit/src/stemtape_player audit/src/board audit/src/workflow audit/src/docs
          cp -r firmware/stemtape_player/. audit/src/stemtape_player/
          cp -r firmware/boards/teenageengineering/stem_player/. audit/src/board/
          cp firmware/west.yml audit/src/
          cp .github/workflows/firmware.yml audit/src/workflow/
          cp .github/scripts/m0_image_assertions.py \
             .github/scripts/m0_assertions_selftest.py \
             .github/scripts/m0_persistence_audit.py \
             .github/scripts/stemtape_player_safety_gate.py \
             .github/scripts/stemtape_player_usb_descriptor_assertions.py audit/src/workflow/
          # the classic Tape Looper baseline the safety gate diffs eMMC
          # write call sites against (see the gate's own module docstring).
          mkdir -p audit/src/classic-baseline
          cp firmware/src/main.c audit/src/classic-baseline/
          cp docs/stem-tape-transfer-v1.md docs/stem-tape-transfer-v1-fixtures.json audit/src/docs/ 2>/dev/null || true
          if [ -f audit/stemtape_player.bin ]; then
            stat -c '%n %s bytes' audit/stemtape_player.bin | tee -a "$GITHUB_STEP_SUMMARY"
            cat audit/sha256.txt | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### stemtape-player: BUILD FAILED -- no final artifact"
              echo '```text'
              echo "zephyr.elf was not produced. See audit/build.log and, if present,"
              echo "audit/zephyr_pre0.map for the linker's partial output."
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload stemtape-player-audit
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: stemtape-player-audit
          path: project/audit/**
          if-no-files-found: error

